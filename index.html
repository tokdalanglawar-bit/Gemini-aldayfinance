    function App() {
      const [loading, setLoading] = useState(true);
      const [accounts, setAccounts] = useState([]);
      const [transactions, setTransactions] = useState([]);
      const [categories, setCategories] = useState([]);
      const [settings, setSettings] = useState(DEFAULT_SETTINGS);

      const [activePage, setActivePage] = useState('dashboard');
      const [mobileMenuOpen, setMobileMenuOpen] = useState(false);
      const [txModalState, setTxModalState] = useState({ open: false, type: 'EXPENSE' });
      const [preselectedAccountId, setPreselectedAccountId] = useState(null);

      const [toast, setToast] = useState(null);
      const [isOnline, setIsOnline] = useState(typeof navigator !== 'undefined' ? navigator.onLine : true);
      const [swStatus, setSwStatus] = useState('IndexedDB Lokal Aktif');

      const showToast = useCallback((message, variant = 'success') => {
        setToast({ id: Date.now(), message, variant });
      }, []);

      useEffect(() => {
        if (!toast) return;
        const timer = setTimeout(() => setToast(null), 3600);
        return () => clearTimeout(timer);
      }, [toast]);

      useEffect(() => {
        const handleOnline = () => setIsOnline(true);
        const handleOffline = () => setIsOnline(false);
        window.addEventListener('online', handleOnline);
        window.addEventListener('offline', handleOffline);
        return () => {
          window.removeEventListener('online', handleOnline);
          window.removeEventListener('offline', handleOffline);
        };
      }, []);

      const loadDatabase = useCallback(async () => {
        setLoading(true);
        try {
          const [dbAccounts, dbTransactions, dbCategories, dbSettings] = await Promise.all([
            localDB.getAll('accounts'),
            localDB.getAll('transactions'),
            localDB.getAll('categories'),
            localDB.getById('settings', 'app-settings')
          ]);

          let finalCategories = dbCategories;
          if (!dbCategories || dbCategories.length === 0) {
            await localDB.bulkPut('categories', DEFAULT_CATEGORIES);
            finalCategories = DEFAULT_CATEGORIES;
          }

          let finalSettings = dbSettings;
          if (!dbSettings) {
            finalSettings = { ...DEFAULT_SETTINGS, initialized: dbAccounts.length > 0 };
            await localDB.put('settings', finalSettings);
          }

          setAccounts(dbAccounts);
          setTransactions(dbTransactions);
          setCategories(finalCategories);
          setSettings(finalSettings);
        } catch (err) {
          console.error('Gagal memuat IndexedDB:', err);
          showToast('Gagal memuat database lokal.', 'error');
        } finally {
          setLoading(false);
        }
      }, [showToast]);

      useEffect(() => {
        loadDatabase();
      }, [loadDatabase]);

      const handleCompleteInitialSetup = async ({ userName, balances }) => {
        const now = getNowISO();
        const initialAccounts = [
          { id: 'acc-default-bri', name: 'Tabungan BRI', bankName: 'BRI', initialBalance: balances.BRI || 0, isActive: true, createdAt: now },
          { id: 'acc-default-bni', name: 'Tabungan BNI', bankName: 'BNI', initialBalance: balances.BNI || 0, isActive: true, createdAt: now },
          { id: 'acc-default-permata', name: 'Tabungan Permata', bankName: 'Permata', initialBalance: balances.Permata || 0, isActive: true, createdAt: now }
        ];

        const updatedSettings = { ...settings, userName, initialized: true };
        await localDB.bulkPut('accounts', initialAccounts);
        await localDB.put('settings', updatedSettings);

        setAccounts(initialAccounts);
        setSettings(updatedSettings);
        showToast('Rekening BRI, BNI, dan Permata berhasil disiapkan!', 'success');
      };

      const saveTransaction = async (txPayload) => {
        await localDB.put('transactions', txPayload);
        setTransactions((prev) => {
          const exists = prev.some((t) => t.id === txPayload.id);
          if (exists) return prev.map((t) => (t.id === txPayload.id ? txPayload : t));
          return [txPayload, ...prev];
        });
      };

      const deleteTransaction = async (txId) => {
        await localDB.delete('transactions', txId);
        setTransactions((prev) => prev.filter((t) => t.id !== txId));
      };

      const saveAccount = async (accPayload) => {
        await localDB.put('accounts', accPayload);
        setAccounts((prev) => {
          const exists = prev.some((a) => a.id === accPayload.id);
          if (exists) return prev.map((a) => (a.id === accPayload.id ? accPayload : a));
          return [...prev, accPayload];
        });
      };

      const saveCategory = async (catPayload) => {
        await localDB.put('categories', catPayload);
        setCategories((prev) => {
          const exists = prev.some((c) => c.id === catPayload.id);
          if (exists) return prev.map((c) => (c.id === catPayload.id ? catPayload : c));
          return [...prev, catPayload];
        });
      };

      const deleteCategoryWithReassign = async (catId, fallbackCatId) => {
        if (fallbackCatId) {
          const affected = transactions.filter((t) => t.categoryId === catId);
          if (affected.length > 0) {
            const updated = affected.map((t) => ({ ...t, categoryId: fallbackCatId, updatedAt: getNowISO() }));
            await localDB.bulkPut('transactions', updated);
            setTransactions((prev) =>
              prev.map((t) => (t.categoryId === catId ? { ...t, categoryId: fallbackCatId } : t))
            );
          }
        }
        await localDB.delete('categories', catId);
        setCategories((prev) => prev.filter((c) => c.id !== catId));
      };

      const updateSettings = async (newSettings) => {
        await localDB.put('settings', newSettings);
        setSettings(newSettings);
      };

      const resetAllData = async () => {
        await localDB.clearAllStores();
        await localDB.bulkPut('categories', DEFAULT_CATEGORIES);
        const freshSettings = { ...DEFAULT_SETTINGS, initialized: false };
        await localDB.put('settings', freshSettings);

        setAccounts([]);
        setTransactions([]);
        setCategories(DEFAULT_CATEGORIES);
        setSettings(freshSettings);
        setActivePage('dashboard');
      };

      const accountBalances = useMemo(
        () => calculateAccountBalances(accounts, transactions),
        [accounts, transactions]
      );

      const navItems = [
        { id: 'dashboard', label: 'Dashboard', icon: 'LayoutDashboard' },
        { id: 'transactions', label: 'Transaksi', icon: 'ArrowLeftRight' },
        { id: 'accounts', label: 'Rekening', icon: 'Wallet' },
        { id: 'transfers', label: 'Transfer', icon: 'Send' },
        { id: 'categories', label: 'Kategori', icon: 'Tags' },
        { id: 'reports', label: 'Laporan', icon: 'BarChart3' },
        { id: 'settings', label: 'Pengaturan', icon: 'Settings' }
      ];

      const bgThemeClass =
        settings.theme === 'midnight-slate'
          ? 'bg-[#090D16]'
          : settings.theme === 'obsidian-emerald'
          ? 'bg-[#060E12]'
          : 'bg-[#060A14]';

      const contextValue = {
        accounts,
        transactions,
        categories,
        settings,
        accountBalances,
        isOnline,
        swStatus,
        saveTransaction,
        deleteTransaction,
        saveAccount,
        saveCategory,
        deleteCategoryWithReassign,
        updateSettings,
        resetAllData,
        showToast
      };

      if (loading) {
        return (
          <div className="min-h-screen bg-[#060A14] text-slate-100 flex flex-col items-center justify-center p-6">
            <div className="w-12 h-12 rounded-2xl border-2 border-cyan-400 border-t-transparent animate-spin mb-4" />
            <p className="text-base font-bold text-white tracking-wide">Memuat AldayFinance...</p>
            <p className="text-xs text-slate-400 mt-1">Menghubungkan ke database lokal IndexedDB</p>
          </div>
        );
      }

      return (
        <FinanceContext.Provider value={contextValue}>
          <div className={`min-h-screen ${bgThemeClass} text-slate-100 flex flex-col lg:flex-row selection:bg-cyan-500/30 selection:text-cyan-200`}>
            {/* SIDEBAR DESKTOP */}
            <aside className="hidden lg:flex lg:w-64 lg:flex-col lg:fixed lg:inset-y-0 bg-slate-950/90 border-r border-slate-800/90 backdrop-blur-xl z-30">
              <div className="p-6 border-b border-slate-800/80">
                <div className="flex items-center gap-3">
                  <div className="w-10 h-10 rounded-2xl bg-gradient-to-br from-cyan-400 via-blue-500 to-indigo-600 flex items-center justify-center shadow-lg shadow-cyan-500/25">
                    <Icon name="Wallet" className="w-5 h-5 text-slate-950" />
                  </div>
                  <div>
                    <h1 className="text-lg font-extrabold text-white tracking-tight leading-none">
                      {settings.appName}
                    </h1>
                    <span className="text-[11px] font-medium text-cyan-400">Personal Finance</span>
                  </div>
                </div>
              </div>

              <nav className="flex-1 px-3.5 py-5 space-y-1.5 overflow-y-auto">
                {navItems.map((item) => {
                  const isActive = activePage === item.id;
                  return (
                    <button
                      key={item.id}
                      onClick={() => setActivePage(item.id)}
                      className={`w-full flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-semibold transition-all ${
                        isActive
                          ? 'bg-gradient-to-r from-cyan-500/20 to-blue-600/15 text-cyan-300 border border-cyan-500/35 shadow-sm'
                          : 'text-slate-400 hover:text-slate-100 hover:bg-slate-900'
                      }`}
                    >
                      <Icon name={item.icon} className={`w-4 h-4 ${isActive ? 'text-cyan-400' : 'text-slate-500'}`} />
                      <span>{item.label}</span>
                    </button>
                  );
                })}
              </nav>

              <div className="p-4 m-3.5 rounded-2xl bg-slate-900/90 border border-slate-800 space-y-2">
                <div className="flex items-center justify-between text-xs">
                  <span className="text-slate-400">Status Penyimpanan</span>
                  <span className="inline-flex items-center gap-1 text-emerald-400 font-semibold">
                    <Icon name="Database" className="w-3 h-3" /> Lokal
                  </span>
                </div>
                <div className="flex items-center justify-between text-xs">
                  <span className="text-slate-400">Koneksi</span>
                  <span className={`inline-flex items-center gap-1 font-semibold ${isOnline ? 'text-cyan-400' : 'text-amber-400'}`}>
                    <Icon name={isOnline ? 'Wifi' : 'WifiOff'} className="w-3 h-3" />
                    {isOnline ? 'Online' : 'Offline'}
                  </span>
                </div>
              </div>
            </aside>

            {/* AREA KONTEN UTAMA */}
            <div className="flex-1 lg:pl-64 flex flex-col min-h-screen pb-20 lg:pb-0">
              <header className="sticky top-0 z-20 bg-slate-950/80 backdrop-blur-xl border-b border-slate-800/80 px-4 sm:px-8 py-3.5 flex items-center justify-between gap-4">
                <div className="flex items-center gap-3">
                  <div className="lg:hidden w-9 h-9 rounded-xl bg-gradient-to-br from-cyan-400 to-blue-600 flex items-center justify-center">
                    <Icon name="Wallet" className="w-4 h-4 text-slate-950" />
                  </div>
                  <div>
                    <p className="text-xs text-slate-400 hidden sm:block">
                      Halo, <span className="text-slate-200 font-semibold">{settings.userName}</span> • Zona Waktu WIB
                    </p>
                    <h2 className="text-base sm:text-lg font-bold text-white lg:hidden">
                      {settings.appName}
                    </h2>
                  </div>
                </div>

                <div className="flex items-center gap-2.5">
                  <span
                    className={`hidden sm:inline-flex items-center gap-1.5 px-3 py-1.5 rounded-full text-xs font-semibold border ${
                      isOnline
                        ? 'bg-emerald-500/10 border-emerald-500/25 text-emerald-300'
                        : 'bg-amber-500/15 border-amber-500/30 text-amber-300'
                    }`}
                  >
                    <Icon name={isOnline ? 'Wifi' : 'WifiOff'} className="w-3.5 h-3.5" />
                    {isOnline ? 'Offline-Ready' : 'Mode Offline'}
                  </span>

                  <button
                    onClick={() => setTxModalState({ open: true, type: 'EXPENSE' })}
                    className="px-4 py-2 rounded-xl text-xs sm:text-sm font-bold text-slate-950 bg-gradient-to-r from-cyan-400 to-blue-500 hover:from-cyan-300 hover:to-blue-400 shadow-lg shadow-cyan-500/20 flex items-center gap-1.5 transition-all"
                  >
                    <Icon name="Plus" className="w-4 h-4" />
                    <span>Catat Transaksi</span>
                  </button>
                </div>
              </header>

              <main className="flex-1 p-4 sm:p-6 lg:p-8 max-w-7xl w-full mx-auto">
                {activePage === 'dashboard' && (
                  <DashboardPage
                    onOpenTxModal={(type) => setTxModalState({ open: true, type })}
                    onSelectAccountDetail={(accId) => {
                      setPreselectedAccountId(accId);
                      setActivePage('accounts');
                    }}
                  />
                )}
                {activePage === 'transactions' && (
                  <TransactionsPage onOpenTxModal={(type) => setTxModalState({ open: true, type })} />
                )}
                {activePage === 'accounts' && (
                  <AccountsPage
                    preselectedAccountId={preselectedAccountId}
                    onClearPreselectedAccount={() => setPreselectedAccountId(null)}
                  />
                )}
                {activePage === 'transfers' && <TransferPage />}
                {activePage === 'categories' && <CategoriesPage />}
                {activePage === 'reports' && <ReportsPage />}
                {activePage === 'settings' && <SettingsPage onNavigate={setActivePage} />}
              </main>
            </div>

            {/* BOTTOM NAVIGATION MOBILE */}
            <nav className="lg:hidden fixed bottom-0 inset-x-0 z-30 bg-slate-950/95 backdrop-blur-xl border-t border-slate-800 px-2 py-1.5 grid grid-cols-5 gap-1">
              {[
                { id: 'dashboard', label: 'Dashboard', icon: 'LayoutDashboard' },
                { id: 'transactions', label: 'Transaksi', icon: 'ArrowLeftRight' },
                { id: 'accounts', label: 'Rekening', icon: 'Wallet' },
                { id: 'transfers', label: 'Transfer', icon: 'Send' },
                { id: 'more', label: 'Lainnya', icon: 'MoreHorizontal' }
              ].map((item) => {
                const isMoreActive = item.id === 'more' && ['categories', 'reports', 'settings'].includes(activePage);
                const isActive = activePage === item.id || isMoreActive;

                return (
                  <button
                    key={item.id}
                    onClick={() => {
                      if (item.id === 'more') {
                        setMobileMenuOpen((prev) => !prev);
                      } else {
                        setMobileMenuOpen(false);
                        setActivePage(item.id);
                      }
                    }}
                    className={`flex flex-col items-center justify-center py-1.5 rounded-xl text-[10px] font-semibold transition-colors ${
                      isActive ? 'text-cyan-400 bg-cyan-500/10' : 'text-slate-400 hover:text-slate-200'
                    }`}
                  >
                    <Icon name={item.icon} className="w-5 h-5 mb-0.5" />
                    <span>{item.label}</span>
                  </button>
                );
              })}
            </nav>

            {/* DRAWER MENU TAMBAHAN MOBILE */}
            {mobileMenuOpen && (
              <div
                className="lg:hidden fixed inset-0 z-40 bg-slate-950/80 backdrop-blur-sm flex items-end"
                onClick={() => setMobileMenuOpen(false)}
              >
                <div
                  className="w-full bg-slate-900 border-t border-slate-700 rounded-t-3xl p-5 pb-24 space-y-2"
                  onClick={(e) => e.stopPropagation()}
                >
                  <div className="flex items-center justify-between pb-2 border-b border-slate-800">
                    <span className="text-xs font-bold uppercase tracking-wider text-slate-400">Menu Lainnya</span>
                    <button onClick={() => setMobileMenuOpen(false)} className="text-slate-400">
                      <Icon name="X" className="w-5 h-5" />
                    </button>
                  </div>
                  {[
                    { id: 'categories', label: 'Kategori Transaksi', icon: 'Tags' },
                    { id: 'reports', label: 'Laporan Keuangan', icon: 'BarChart3' },
                    { id: 'settings', label: 'Pengaturan & Uji Akurasi', icon: 'Settings' }
                  ].map((m) => (
                    <button
                      key={m.id}
                      onClick={() => {
                        setActivePage(m.id);
                        setMobileMenuOpen(false);
                      }}
                      className={`w-full flex items-center gap-3 px-4 py-3.5 rounded-xl text-sm font-semibold ${
                        activePage === m.id
                          ? 'bg-cyan-500/20 text-cyan-300 border border-cyan-500/30'
                          : 'text-slate-200 hover:bg-slate-800'
                      }`}
                    >
                      <Icon name={m.icon} className="w-4 h-4 text-cyan-400" />
                      {m.label}
                    </button>
                  ))}
                </div>
              </div>
            )}

            <InitialSetupModal
              open={!settings.initialized && accounts.length === 0}
              onComplete={handleCompleteInitialSetup}
            />

            <TransactionModal
              open={txModalState.open}
              initialType={txModalState.type}
              onClose={() => setTxModalState({ open: false, type: 'EXPENSE' })}
            />

            {toast && (
              <div className="fixed top-4 right-4 z-50 max-w-sm animate-fadeIn">
                <div
                  className={`px-4 py-3 rounded-2xl shadow-2xl border backdrop-blur-md flex items-center gap-3 text-xs sm:text-sm font-semibold ${
                    toast.variant === 'error'
                      ? 'bg-rose-950/95 border-rose-500/50 text-rose-200'
                      : toast.variant === 'info'
                      ? 'bg-slate-900/95 border-cyan-500/50 text-cyan-200'
                      : 'bg-emerald-950/95 border-emerald-500/50 text-emerald-200'
                  }`}
                >
                  <Icon
                    name={toast.variant === 'error' ? 'AlertTriangle' : 'CheckCircle2'}
                    className={`w-4 h-4 shrink-0 ${toast.variant === 'error' ? 'text-rose-400' : 'text-emerald-400'}`}
                  />
                  <span>{toast.message}</span>
                </div>
              </div>
            )}
          </div>
        </FinanceContext.Provider>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
