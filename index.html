    // 3. UTILITAS WAKTU (ASIA/JAKARTA) & PEMFORMATAN RUPIAH INTEGER
    // ============================================================================
    function getTodayWIB() {
      try {
        return new Intl.DateTimeFormat('en-CA', {
          timeZone: 'Asia/Jakarta',
          year: 'numeric',
          month: '2-digit',
          day: '2-digit'
        }).format(new Date());
      } catch {
        const now = new Date();
        const utc = now.getTime() + now.getTimezoneOffset() * 60000;
        const wib = new Date(utc + 7 * 3600000);
        return wib.toISOString().slice(0, 10);
      }
    }

    function getNowISO() {
      return new Date().toISOString();
    }

    function generateId(prefix = 'id') {
      if (typeof crypto !== 'undefined' && crypto.randomUUID) {
        return `${prefix}-${crypto.randomUUID()}`;
      }
      return `${prefix}-${Date.now()}-${Math.random().toString(36).substring(2, 9)}`;
    }

    function formatRupiah(amount, numberFormat = 'id-ID', withSymbol = true) {
      const safeInt = Math.round(Number(amount) || 0);
      const absVal = Math.abs(safeInt);
      const formatted = new Intl.NumberFormat(numberFormat === 'en-US' ? 'en-US' : 'id-ID', {
        maximumFractionDigits: 0,
        minimumFractionDigits: 0
      }).format(absVal);
      const prefix = safeInt < 0 ? '-' : '';
      return withSymbol ? `${prefix}Rp ${formatted}` : `${prefix}${formatted}`;
    }

    function formatTanggal(dateStr, format = 'DD MMM YYYY') {
      if (!dateStr) return '-';
      const parts = dateStr.split('-');
      if (parts.length !== 3) return dateStr;
      const [year, month, day] = parts;
      const bulanPendek = ['Jan', 'Feb', 'Mar', 'Apr', 'Mei', 'Jun', 'Jul', 'Agu', 'Sep', 'Okt', 'Nov', 'Des'];
      const monthIdx = Math.max(0, Math.min(11, parseInt(month, 10) - 1));
      if (format === 'YYYY-MM-DD') return `${year}-${month}-${day}`;
      if (format === 'DD/MM/YYYY') return `${day}/${month}/${year}`;
      return `${parseInt(day, 10)} ${bulanPendek[monthIdx]} ${year}`;
    }

    function getPeriodRange(periodType, baseDateStr = getTodayWIB(), customStart = '', customEnd = '') {
      const [y, m, d] = baseDateStr.split('-').map(Number);
      const baseDate = new Date(Date.UTC(y, m - 1, d));
      const toYMD = (dt) => dt.toISOString().slice(0, 10);

      if (periodType === 'TODAY') {
        return { startDate: baseDateStr, endDate: baseDateStr, label: `Hari Ini (${formatTanggal(baseDateStr)})` };
      }
      if (periodType === 'WEEK') {
        const dayOfWeek = baseDate.getUTCDay();
        const diffToMonday = dayOfWeek === 0 ? -6 : 1 - dayOfWeek;
        const monday = new Date(baseDate);
        monday.setUTCDate(baseDate.getUTCDate() + diffToMonday);
        const sunday = new Date(monday);
        sunday.setUTCDate(monday.getUTCDate() + 6);
        return {
          startDate: toYMD(monday),
          endDate: toYMD(sunday),
          label: `Minggu Ini (${formatTanggal(toYMD(monday))} - ${formatTanggal(toYMD(sunday))})`
        };
      }
      if (periodType === 'MONTH') {
        const firstDay = new Date(Date.UTC(y, m - 1, 1));
        const lastDay = new Date(Date.UTC(y, m, 0));
        const namaBulan = [
          'Januari', 'Februari', 'Maret', 'April', 'Mei', 'Juni',
          'Juli', 'Agustus', 'September', 'Oktober', 'November', 'Desember'
        ][m - 1];
        return {
          startDate: toYMD(firstDay),
          endDate: toYMD(lastDay),
          label: `${namaBulan} ${y}`
        };
      }
      if (periodType === 'YEAR') {
        return {
          startDate: `${y}-01-01`,
          endDate: `${y}-12-31`,
          label: `Tahun ${y}`
        };
      }
      const s = customStart || baseDateStr;
      const e = customEnd || baseDateStr;
      return {
        startDate: s <= e ? s : e,
        endDate: s <= e ? e : s,
        label: `${formatTanggal(s <= e ? s : e)} - ${formatTanggal(s <= e ? e : s)}`
      };
    }

    // ============================================================================
    // 4. DATABASE LOKAL INDEXEDDB (OFFLINE-FIRST PERSISTENT STORAGE)
    // ============================================================================
    class AldayIndexedDB {
      constructor() {
        this.db = null;
      }

      async open() {
        if (this.db) return this.db;
        return new Promise((resolve, reject) => {
          if (typeof indexedDB === 'undefined') {
            reject(new Error('IndexedDB tidak didukung oleh browser ini.'));
            return;
          }
          const request = indexedDB.open(DB_NAME, DB_VERSION);
          request.onupgradeneeded = (event) => {
            const db = event.target.result;
            if (!db.objectStoreNames.contains('accounts')) {
              const accStore = db.createObjectStore('accounts', { keyPath: 'id' });
              accStore.createIndex('bankName', 'bankName', { unique: false });
              accStore.createIndex('isActive', 'isActive', { unique: false });
            }
            if (!db.objectStoreNames.contains('transactions')) {
              const txStore = db.createObjectStore('transactions', { keyPath: 'id' });
              txStore.createIndex('date', 'date', { unique: false });
              txStore.createIndex('type', 'type', { unique: false });
              txStore.createIndex('categoryId', 'categoryId', { unique: false });
              txStore.createIndex('fromAccountId', 'fromAccountId', { unique: false });
              txStore.createIndex('toAccountId', 'toAccountId', { unique: false });
            }
            if (!db.objectStoreNames.contains('categories')) {
              const catStore = db.createObjectStore('categories', { keyPath: 'id' });
              catStore.createIndex('type', 'type', { unique: false });
            }
            if (!db.objectStoreNames.contains('settings')) {
              db.createObjectStore('settings', { keyPath: 'id' });
            }
          };
          request.onsuccess = (event) => {
            this.db = event.target.result;
            resolve(this.db);
          };
          request.onerror = (event) => {
            reject(event.target.error || new Error('Gagal membuka IndexedDB.'));
          };
        });
      }

      async getAll(storeName) {
        const db = await this.open();
        return new Promise((resolve, reject) => {
          const tx = db.transaction(storeName, 'readonly');
          const req = tx.objectStore(storeName).getAll();
          req.onsuccess = () => resolve(req.result || []);
          req.onerror = () => reject(req.error);
        });
      }

      async getById(storeName, id) {
        const db = await this.open();
        return new Promise((resolve, reject) => {
          const tx = db.transaction(storeName, 'readonly');
          const req = tx.objectStore(storeName).get(id);
          req.onsuccess = () => resolve(req.result || null);
          req.onerror = () => reject(req.error);
        });
      }

      async put(storeName, item) {
        const db = await this.open();
        return new Promise((resolve, reject) => {
          const tx = db.transaction(storeName, 'readwrite');
          const req = tx.objectStore(storeName).put(item);
          req.onsuccess = () => resolve(item);
          req.onerror = () => reject(req.error);
        });
      }

      async bulkPut(storeName, items) {
        const db = await this.open();
        return new Promise((resolve, reject) => {
          const tx = db.transaction(storeName, 'readwrite');
          const store = tx.objectStore(storeName);
          items.forEach((item) => store.put(item));
          tx.oncomplete = () => resolve(items);
          tx.onerror = () => reject(tx.error);
        });
      }

      async delete(storeName, id) {
        const db = await this.open();
        return new Promise((resolve, reject) => {
          const tx = db.transaction(storeName, 'readwrite');
          const req = tx.objectStore(storeName).delete(id);
          req.onsuccess = () => resolve(true);
          req.onerror = () => reject(req.error);
        });
      }

      async clearAllStores() {
        const db = await this.open();
        const storeNames = ['accounts', 'transactions', 'categories', 'settings'];
        return new Promise((resolve, reject) => {
          const tx = db.transaction(storeNames, 'readwrite');
          storeNames.forEach((name) => tx.objectStore(name).clear());
          tx.oncomplete = () => resolve(true);
          tx.onerror = () => reject(tx.error);
        });
      }
    }

    const localDB = new AldayIndexedDB();

    function validateTransactionInput(txData, accounts) {
      const errors = [];
      const amount = Math.round(Number(txData.amount));
      const adminFee = Math.round(Number(txData.adminFee || 0));

      if (!txData.type || !['INCOME', 'EXPENSE', 'TRANSFER'].includes(txData.type)) {
        errors.push('Jenis transaksi tidak valid.');
      }
      if (!txData.date || !/^\d{4}-\d{2}-\d{2}$/.test(txData.date)) {
        errors.push('Tanggal transaksi wajib diisi dengan format yang valid.');
      }
      if (!Number.isInteger(amount) || amount <= 0) {
        errors.push('Nominal transaksi harus lebih besar dari Rp 0.');
      }
      if (!txData.description || !txData.description.trim()) {
        errors.push('Deskripsi transaksi wajib diisi.');
      }

      const accountMap = new Map(accounts.map((a) => [a.id, a]));

      if (txData.type === 'INCOME') {
        if (!txData.toAccountId || !accountMap.has(txData.toAccountId)) {
          errors.push('Rekening tujuan pemasukan harus dipilih dan valid.');
        }
        if (!txData.categoryId) errors.push('Kategori pemasukan wajib dipilih.');
      }
      if (txData.type === 'EXPENSE') {
        if (!txData.fromAccountId || !accountMap.has(txData.fromAccountId)) {
          errors.push('Rekening sumber pengeluaran harus dipilih dan valid.');
        }
        if (!txData.categoryId) errors.push('Kategori pengeluaran wajib dipilih.');
      }
      if (txData.type === 'TRANSFER') {
        if (!txData.fromAccountId || !accountMap.has(txData.fromAccountId)) {
          errors.push('Rekening asal transfer harus dipilih.');
        }
        if (!txData.toAccountId || !accountMap.has(txData.toAccountId)) {
          errors.push('Rekening tujuan transfer harus dipilih.');
        }
        if (txData.fromAccountId && txData.toAccountId && txData.fromAccountId === txData.toAccountId) {
          errors.push('Rekening asal dan rekening tujuan transfer tidak boleh sama.');
        }
        if (!Number.isInteger(adminFee) || adminFee < 0) {
          errors.push('Biaya administrasi tidak boleh bernilai negatif.');
        }
      }

      return { isValid: errors.length === 0, errors };
    }

    function calculateAccountBalances(accounts, transactions) {
      const balances = {};
      accounts.forEach((acc) => {
        balances[acc.id] = Math.round(Number(acc.initialBalance) || 0);
      });

      transactions.forEach((tx) => {
        const amt = Math.round(Number(tx.amount) || 0);
        const fee = Math.round(Number(tx.adminFee) || 0);

        if (tx.type === 'INCOME' && tx.toAccountId && balances[tx.toAccountId] !== undefined) {
          balances[tx.toAccountId] += amt;
        } else if (tx.type === 'EXPENSE' && tx.fromAccountId && balances[tx.fromAccountId] !== undefined) {
          balances[tx.fromAccountId] -= amt;
        } else if (tx.type === 'TRANSFER') {
          if (tx.fromAccountId && balances[tx.fromAccountId] !== undefined) {
            balances[tx.fromAccountId] -= (amt + fee);
          }
          if (tx.toAccountId && balances[tx.toAccountId] !== undefined) {
            balances[tx.toAccountId] += amt;
          }
        }
      });

      return balances;
    }

    function calculatePeriodMetrics(transactions, startDate, endDate) {
      const filtered = transactions.filter((tx) => tx.date >= startDate && tx.date <= endDate);

      let totalIncome = 0;
      let operationalExpense = 0;
      let totalAdminFee = 0;
      let totalInternalTransfer = 0;
      let transferCount = 0;

      filtered.forEach((tx) => {
        const amt = Math.round(Number(tx.amount) || 0);
        const fee = Math.round(Number(tx.adminFee) || 0);

        if (tx.type === 'INCOME') totalIncome += amt;
        else if (tx.type === 'EXPENSE') operationalExpense += amt;
        else if (tx.type === 'TRANSFER') {
          totalInternalTransfer += amt;
          totalAdminFee += fee;
          transferCount += 1;
        }
      });

      const totalExpense = operationalExpense + totalAdminFee;
      const netCashflow = totalIncome - totalExpense;

      return {
        transactions: filtered,
        transactionCount: filtered.length,
        totalIncome,
        operationalExpense,
        totalAdminFee,
        totalExpense,
        netCashflow,
        totalInternalTransfer,
        transferCount
      };
    }

    function runFinancialUnitTests() {
      const results = [];
      const assert = (name, condition, detail) => {
        results.push({ id: results.length + 1, name, passed: Boolean(condition), detail });
      };

      const mockAccounts = [
        { id: 'acc-bri', name: 'Tabungan BRI', bankName: 'BRI', initialBalance: 5000000, isActive: true },
        { id: 'acc-bni', name: 'Tabungan BNI', bankName: 'BNI', initialBalance: 2000000, isActive: true },
        { id: 'acc-prm', name: 'Permata Me', bankName: 'Permata', initialBalance: 1000000, isActive: true }
      ];

      const bal0 = calculateAccountBalances(mockAccounts, []);
      assert(
        'Inisialisasi Saldo Awal BRI, BNI, Permata',
        bal0['acc-bri'] === 5000000 && bal0['acc-bni'] === 2000000 && bal0['acc-prm'] === 1000000,
        'BRI: Rp 5.000.000, BNI: Rp 2.000.000, Permata: Rp 1.000.000 (Total: Rp 8.000.000)'
      );

      const txs1 = [
        { id: 't1', type: 'INCOME', date: '2026-11-10', amount: 3500000, toAccountId: 'acc-bri', categoryId: 'cat-inc-gaji', description: 'Gaji' },
        { id: 't2', type: 'EXPENSE', date: '2026-11-12', amount: 450000, fromAccountId: 'acc-bni', categoryId: 'cat-exp-makan', description: 'Makan' }
      ];
      const bal1 = calculateAccountBalances(mockAccounts, txs1);
      assert(
        'Perhitungan Pemasukan & Pengeluaran',
        bal1['acc-bri'] === 8500000 && bal1['acc-bni'] === 1550000,
        'BRI menjadi Rp 8.500.000 (+3.5jt), BNI menjadi Rp 1.550.000 (-450rb)'
      );

      const txs2 = [
        ...txs1,
        { id: 't3', type: 'TRANSFER', date: '2026-11-15', amount: 500000, adminFee: 2500, fromAccountId: 'acc-bri', toAccountId: 'acc-bni', description: 'Transfer' }
      ];
      const bal2 = calculateAccountBalances(mockAccounts, txs2);
      assert(
        'Transfer Rp 500.000 (BRI -> BNI) + Admin Rp 2.500',
        bal2['acc-bri'] === 7997500 && bal2['acc-bni'] === 2050000,
        'BRI berkurang Rp 502.500 -> Rp 7.997.500; BNI bertambah Rp 500.000 -> Rp 2.050.000'
      );

      const metrics2 = calculatePeriodMetrics(txs2, '2026-11-01', '2026-11-30');
      assert(
        'Isolasi Transfer & Pencatatan Biaya Admin di Laporan',
        metrics2.totalIncome === 3500000 &&
          metrics2.totalExpense === 452500 &&
          metrics2.totalAdminFee === 2500 &&
          metrics2.totalInternalTransfer === 500000,
        'Pemasukan: Rp 3.500.000, Pengeluaran: Rp 452.500 (termasuk admin Rp 2.500), Transfer Internal: Rp 500.000'
      );

      const bal3 = calculateAccountBalances(mockAccounts, txs1);
      assert(
        'Penghapusan Transaksi Mengembalikan Saldo Presisi',
        bal3['acc-bri'] === 8500000 && bal3['acc-bni'] === 1550000,
        'Setelah transfer dihapus, BRI kembali ke Rp 8.500.000 dan BNI kembali ke Rp 1.550.000'
      );

      const invalidSameAcc = validateTransactionInput(
        { type: 'TRANSFER', date: '2026-11-15', amount: 100000, adminFee: 0, fromAccountId: 'acc-bri', toAccountId: 'acc-bri', description: 'Tes' },
        mockAccounts
      );
      assert(
        'Validasi Anti-Bug (Rekening Sama & Nominal Nol)',
        !invalidSameAcc.isValid,
        'Menolak transfer rekening asal=tujuan dan nominal <= Rp 0'
      );

      return results;
    }

    function InteractiveAreaChart({ data, numberFormat }) {
      const [hoverIdx, setHoverIdx] = useState(null);
      const width = 520;
      const height = 200;
      const padX = 16;
      const padY = 24;

      const values = data.map((d) => Number(d.Saldo) || 0);
      const minVal = Math.min(...values, 0);
      const maxVal = Math.max(...values, 1);
      const span = Math.max(1, maxVal - minVal);

      const points = data.map((d, idx) => {
        const x = data.length === 1
          ? width / 2
          : padX + (idx / (data.length - 1)) * (width - padX * 2);

        return { x, y, ...d };
      });

      const linePath = points.map((p, i) => `${i === 0 ? 'M' : 'L'} ${p.x.toFixed(1)} ${p.y.toFixed(1)}`).join(' ');
      const areaPath = points.length > 1
        ? `${linePath} L ${points[points.length - 1].x.toFixed(1)} ${height - padY} L ${points[0].x.toFixed(1)} ${height - padY} Z`

    function CurrencyInput({ value, onChange, placeholder = '0', numberFormat = 'id-ID', disabled = false, id }) {
      const displayValue = useMemo(() => {
        const num = Math.round(Number(value) || 0);
        if (num === 0 && (value === '' || value === null || value === undefined)) return '';
        return new Intl.NumberFormat(numberFormat === 'en-US' ? 'en-US' : 'id-ID', {
          maximumFractionDigits: 0
        }).format(num);
      }, [value, numberFormat]);

      const handleChange = (e) => {
        const rawDigits = e.target.value.replace(/\D/g, '');
        if (!rawDigits) {
          onChange('');
          return;
        }
        const parsedInt = parseInt(rawDigits, 10);
        onChange(Number.isNaN(parsedInt) ? '' : parsedInt);
      };

      return (
        <div className="relative flex items-center">
          <span className="absolute left-3.5 text-sm font-semibold text-cyan-400 select-none pointer-events-none">
            Rp
          </span>
          <input
            id={id}
            type="text"
            inputMode="numeric"
            disabled={disabled}
            value={displayValue}
            onChange={handleChange}
            placeholder={placeholder}
            className="w-full pl-10 pr-4 py-2.5 bg-slate-950/80 border border-slate-700/80 rounded-xl text-slate-100 font-semibold tabular-nums placeholder-slate-500 focus:outline-none focus:border-cyan-400 focus:ring-2 focus:ring-cyan-500/20 transition-all disabled:opacity-50"
          />
        </div>
      );
    }

    function ConfirmDialog({ open, title, message, confirmLabel = 'Ya, Lanjutkan', danger = true, requireKeyword = '', onConfirm, onCancel }) {
      const [typed, setTyped] = useState('');

      useEffect(() => {
        if (open) setTyped('');
      }, [open]);

      if (!open) return null;
      const canConfirm = !requireKeyword || typed.trim() === requireKeyword;

      return (
        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-950/80 backdrop-blur-sm animate-fadeIn">
          <div className="w-full max-w-md bg-slate-900 border border-slate-700/80 rounded-2xl shadow-2xl overflow-hidden">
            <div className="p-6">
              <div className="flex items-start gap-4">
                <div className={`p-3 rounded-xl shrink-0 ${danger ? 'bg-rose-500/15 text-rose-400 border border-rose-500/30' : 'bg-cyan-500/15 text-cyan-400 border border-cyan-500/30'}`}>
                  <Icon name="AlertTriangle" className="w-6 h-6" />
                </div>
                <div className="flex-1">
                  <h3 className="text-lg font-bold text-slate-100">{title}</h3>
                  <p className="mt-2 text-sm text-slate-300 leading-relaxed">{message}</p>
                </div>
              </div>

              {requireKeyword && (
                <div className="mt-5 p-3.5 rounded-xl bg-rose-950/30 border border-rose-500/30">
                  <label className="block text-xs font-medium text-rose-300 mb-2">
                    Ketik <span className="font-mono font-bold px-1.5 py-0.5 bg-rose-500/20 rounded text-rose-200">{requireKeyword}</span> untuk mengonfirmasi:
                  </label>
                  <input
                    type="text"
                    value={typed}
                    onChange={(e) => setTyped(e.target.value)}
                    placeholder={requireKeyword}
                    className="w-full px-3 py-2 bg-slate-950 border border-rose-500/40 rounded-lg text-sm text-white font-mono focus:outline-none focus:border-rose-400"
                  />
                </div>
              )}
            </div>

            <div className="px-6 py-4 bg-slate-950/60 border-t border-slate-800 flex items-center justify-end gap-3">
              <button
                type="button"
                onClick={onCancel}
                className="px-4 py-2.5 rounded-xl text-sm font-medium text-slate-300 hover:text-white bg-slate-800/80 hover:bg-slate-700/80 transition-colors"
              >
                Batal
              </button>
              <button
                type="button"
                disabled={!canConfirm}
                onClick={onConfirm}
                className={`px-4 py-2.5 rounded-xl text-sm font-semibold text-white transition-all disabled:opacity-40 disabled:cursor-not-allowed ${
                  danger
                    ? 'bg-gradient-to-r from-rose-600 to-red-600 hover:from-rose-500 hover:to-red-500'
                    : 'bg-gradient-to-r from-cyan-600 to-blue-600 hover:from-cyan-500 hover:to-blue-500'
                }`}
              >
                {confirmLabel}
              </button>
            </div>
          </div>
        </div>
      );
    }

      const handleSubmit = async (e) => {

        setSubmitting(true);
        try {

              BRI: Math.round(Number(briBalance) || 0),
              BNI: Math.round(Number(bniBalance) || 0),
              Permata: Math.round(Number(permataBalance) || 0)

              </p>

            <form onSubmit={handleSubmit} className="p-6 sm:p-8 space-y-5">

                  Nama Pengguna

                <input

                  value={userName}
                  onChange={(e) => setUserName(e.target.value)}

              <div className="space-y-4 pt-1">

                <div className="p-3.5 rounded-2xl bg-slate-950/60 border border-blue-500/25 space-y-2">

                    <span className="text-sm font-bold text-blue-300 flex items-center gap-2">
                      <Icon name="Building2" className="w-4 h-4" /> Bank BRI
                    </span>
                    <span className="text-xs text-slate-400">Rekening Utama BRI</span>
                  </div>
                  <CurrencyInput value={briBalance} onChange={setBriBalance} placeholder="0" />

                <div className="p-3.5 rounded-2xl bg-slate-950/60 border border-orange-500/25 space-y-2">
                  <div className="flex items-center justify-between">
                    <span className="text-sm font-bold text-orange-300 flex items-center gap-2">
                      <Icon name="Building2" className="w-4 h-4" /> Bank BNI
                    </span>
                    <span className="text-xs text-slate-400">Rekening Utama BNI</span>

                    <span className="text-xs text-slate-400">Rekening Utama Permata</span>

                  <CurrencyInput value={permataBalance} onChange={setPermataBalance} placeholder="0" />

              <div className="pt-2">
                <button

                >
                  <Icon name="CheckCircle2" className="w-5 h-5" />

    function TransactionModal({ open, initialType = 'EXPENSE', editingTx = null, defaultFromAccountId = '', onClose }) {
      const { accounts, categories, accountBalances, saveTransaction, settings, showToast } = useFinance();

      const activeAccounts = useMemo(
        () => accounts.filter((a) => a.isActive || (editingTx && (a.id === editingTx.fromAccountId || a.id === editingTx.toAccountId))),
        [accounts, editingTx]
      );

      const [type, setType] = useState(initialType);
      const [date, setDate] = useState(getTodayWIB());
      const [amount, setAmount] = useState('');
      const [adminFee, setAdminFee] = useState('');
      const [categoryId, setCategoryId] = useState('');
      const [fromAccountId, setFromAccountId] = useState('');
      const [toAccountId, setToAccountId] = useState('');
      const [description, setDescription] = useState('');
      const [notes, setNotes] = useState('');
      const [errors, setErrors] = useState([]);
      const [saving, setSaving] = useState(false);

      const filteredCategories = useMemo(
        () => categories.filter((c) => c.type === (type === 'INCOME' ? 'INCOME' : 'EXPENSE')),
        [categories, type]
      );

      useEffect(() => {
        if (!open) return;
        setErrors([]);
        if (editingTx) {
          setType(editingTx.type);
          setDate(editingTx.date);
          setAmount(editingTx.amount);
          setAdminFee(editingTx.adminFee || '');
          setCategoryId(editingTx.categoryId || '');
          setFromAccountId(editingTx.fromAccountId || '');
          setToAccountId(editingTx.toAccountId || '');
          setDescription(editingTx.description || '');
          setNotes(editingTx.notes || '');
        } else {
          const targetType = initialType || 'EXPENSE';
          setType(targetType);
          setDate(getTodayWIB());
          setAmount('');
          setAdminFee('');
          const catsForType = categories.filter((c) => c.type === (targetType === 'INCOME' ? 'INCOME' : 'EXPENSE'));
          setCategoryId(catsForType[0]?.id || '');
          const firstAcc = defaultFromAccountId || activeAccounts[0]?.id || '';
          const secondAcc = activeAccounts.find((a) => a.id !== firstAcc)?.id || '';
          setFromAccountId(firstAcc);
          setToAccountId(targetType === 'TRANSFER' ? secondAcc : firstAcc);
          setDescription('');
          setNotes('');
        }
      }, [open, editingTx, initialType, defaultFromAccountId, categories, activeAccounts]);

      const handleTypeSwitch = (newType) => {
        if (editingTx) return;
        setType(newType);
        setErrors([]);
        if (newType === 'INCOME' || newType === 'EXPENSE') {
          const cats = categories.filter((c) => c.type === newType);
          setCategoryId(cats[0]?.id || '');
          if (newType === 'INCOME' && !toAccountId) setToAccountId(activeAccounts[0]?.id || '');
          if (newType === 'EXPENSE' && !fromAccountId) setFromAccountId(activeAccounts[0]?.id || '');
        } else if (newType === 'TRANSFER') {
          const src = fromAccountId || activeAccounts[0]?.id || '';
          setFromAccountId(src);
          if (!toAccountId || toAccountId === src) {
            setToAccountId(activeAccounts.find((a) => a.id !== src)?.id || '');
          }
        }
      };

      if (!open) return null;

      const numAmount = Math.round(Number(amount) || 0);
      const numFee = Math.round(Number(adminFee) || 0);
      const totalDeducted = numAmount + numFee;

      const handleSubmit = async (e) => {
        e.preventDefault();
        const payload = {
          id: editingTx?.id || generateId('tx'),
          type,
          date,
          amount: numAmount,
          adminFee: type === 'TRANSFER' ? numFee : 0,
          categoryId: type === 'TRANSFER' ? null : categoryId,
          fromAccountId: type === 'EXPENSE' || type === 'TRANSFER' ? fromAccountId : null,
          toAccountId: type === 'INCOME' || type === 'TRANSFER' ? toAccountId : null,
          description: description.trim(),
          notes: notes.trim(),
          createdAt: editingTx?.createdAt || getNowISO(),
          updatedAt: getNowISO()
        };

        const validation = validateTransactionInput(payload, accounts);
        if (!validation.isValid) {
          setErrors(validation.errors);
          return;
        }

        setSaving(true);
        try {
          await saveTransaction(payload, Boolean(editingTx));
          showToast(editingTx ? 'Transaksi berhasil diperbarui.' : 'Transaksi baru berhasil dicatat.', 'success');
          onClose();
        } catch (err) {
          setErrors([err.message || 'Terjadi kesalahan saat menyimpan transaksi.']);
        } finally {
          setSaving(false);
        }
      };

      return (
        <div className="fixed inset-0 z-50 flex items-center justify-center p-3 sm:p-4 bg-slate-950/85 backdrop-blur-sm overflow-y-auto">
          <div className="w-full max-w-xl bg-slate-900 border border-slate-700/80 rounded-2xl sm:rounded-3xl shadow-2xl overflow-hidden my-auto">
            <div className="px-5 py-4 sm:px-6 sm:py-5 bg-slate-950/70 border-b border-slate-800 flex items-center justify-between">
              <div>
                <h3 className="text-lg font-bold text-white">
                  {editingTx ? 'Edit Transaksi' : 'Catat Transaksi Baru'}
                </h3>
                <p className="text-xs text-slate-400 mt-0.5">
                  Saldo rekening dan laporan diperbarui secara otomatis
                </p>
              </div>
              <button
                type="button"
                onClick={onClose}
                className="p-2 rounded-xl text-slate-400 hover:text-white hover:bg-slate-800 transition-colors"
              >
                <Icon name="X" className="w-5 h-5" />
              </button>
            </div>

            <div className="px-5 pt-4 sm:px-6">
              <div className="grid grid-cols-3 gap-2 p-1.5 bg-slate-950 rounded-2xl border border-slate-800">
                <button
                  type="button"
                  disabled={Boolean(editingTx)}
                  onClick={() => handleTypeSwitch('EXPENSE')}
                  className={`py-2.5 px-3 rounded-xl text-xs sm:text-sm font-semibold flex items-center justify-center gap-1.5 transition-all ${
                    type === 'EXPENSE'
                      ? 'bg-rose-500/20 text-rose-300 border border-rose-500/40 shadow-sm'
                      : 'text-slate-400 hover:text-slate-200 disabled:opacity-40'
                  }`}
                >
                  <Icon name="ArrowDownRight" className="w-4 h-4" />
                  Pengeluaran
                </button>
                <button
                  type="button"
                  disabled={Boolean(editingTx)}
                  onClick={() => handleTypeSwitch('INCOME')}
                  className={`py-2.5 px-3 rounded-xl text-xs sm:text-sm font-semibold flex items-center justify-center gap-1.5 transition-all ${
                    type === 'INCOME'
                      ? 'bg-emerald-500/20 text-emerald-300 border border-emerald-500/40 shadow-sm'
                      : 'text-slate-400 hover:text-slate-200 disabled:opacity-40'
                  }`}
                >
                  <Icon name="ArrowUpRight" className="w-4 h-4" />
                  Pemasukan
                </button>
                <button
                  type="button"
                  disabled={Boolean(editingTx)}
                  onClick={() => handleTypeSwitch('TRANSFER')}
                  className={`py-2.5 px-3 rounded-xl text-xs sm:text-sm font-semibold flex items-center justify-center gap-1.5 transition-all ${
                    type === 'TRANSFER'
                      ? 'bg-cyan-500/20 text-cyan-300 border border-cyan-500/40 shadow-sm'
                      : 'text-slate-400 hover:text-slate-200 disabled:opacity-40'
                  }`}
                >
                  <Icon name="Send" className="w-4 h-4" />
                  Transfer
                </button>
              </div>
            </div>

            <form onSubmit={handleSubmit} className="p-5 sm:p-6 space-y-4">
              {errors.length > 0 && (
                <div className="p-3.5 rounded-xl bg-rose-500/15 border border-rose-500/40 text-rose-200 text-xs space-y-1">
                  {errors.map((err, i) => (
                    <div key={i} className="flex items-center gap-2">
                      <Icon name="AlertTriangle" className="w-4 h-4 shrink-0 text-rose-400" />
                      <span>{err}</span>
                    </div>
                  ))}
                </div>
              )}

              <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <div>
                  <label className="block text-xs font-semibold text-slate-400 mb-1.5">
                    Tanggal Transaksi <span className="text-rose-400">*</span>
                  </label>
                  <input
                    type="date"
                    value={date}
                    onChange={(e) => setDate(e.target.value)}
                    required
                    className="w-full px-3.5 py-2.5 bg-slate-950/80 border border-slate-700/80 rounded-xl text-sm text-slate-100 focus:outline-none focus:border-cyan-400"
                  />
                </div>

                <div>
                  <label className="block text-xs font-semibold text-slate-400 mb-1.5">
                    {type === 'TRANSFER' ? 'Nominal Transfer' : 'Nominal'} <span className="text-rose-400">*</span>
                  </label>
                  <CurrencyInput
                    value={amount}
                    onChange={setAmount}
                    numberFormat={settings.numberFormat}
                    placeholder="0"
                  />
                </div>
              </div>

              {type === 'TRANSFER' ? (
                <>
                  <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div>
                      <label className="block text-xs font-semibold text-slate-400 mb-1.5">
                        Rekening Asal <span className="text-rose-400">*</span>
                      </label>
                      <select
                        value={fromAccountId}
                        onChange={(e) => setFromAccountId(e.target.value)}
                        className="w-full px-3.5 py-2.5 bg-slate-950/80 border border-slate-700/80 rounded-xl text-sm text-slate-100 focus:outline-none focus:border-cyan-400"
                      >
                        <option value="">-- Pilih Rekening Asal --</option>
                        {activeAccounts.map((acc) => (
                          <option key={acc.id} value={acc.id}>
                            {acc.bankName} - {acc.name} ({formatRupiah(accountBalances[acc.id] || 0, settings.numberFormat)})
                          </option>
                        ))}
                      </select>
                    </div>

                    <div>
                      <label className="block text-xs font-semibold text-slate-400 mb-1.5">
                        Rekening Tujuan <span className="text-rose-400">*</span>
                      </label>
                      <select
                        value={toAccountId}
                        onChange={(e) => setToAccountId(e.target.value)}
                        className="w-full px-3.5 py-2.5 bg-slate-950/80 border border-slate-700/80 rounded-xl text-sm text-slate-100 focus:outline-none focus:border-cyan-400"
                      >
                        <option value="">-- Pilih Rekening Tujuan --</option>
                        {activeAccounts.map((acc) => (
                          <option key={acc.id} value={acc.id}>
                            {acc.bankName} - {acc.name} ({formatRupiah(accountBalances[acc.id] || 0, settings.numberFormat)})
                          </option>
                        ))}
                      </select>
                    </div>
                  </div>

                  <div>
                    <div className="flex items-center justify-between mb-1.5">
                      <label className="text-xs font-semibold text-slate-400">
                        Biaya Administrasi (Dicatat sebagai Pengeluaran)
                      </label>
                      <div className="flex items-center gap-1.5">
                        {[0, 2500, 6500].map((preset) => (
                          <button
                            key={preset}
                            type="button"
                            onClick={() => setAdminFee(preset === 0 ? '' : preset)}
                            className={`px-2 py-0.5 rounded-md text-[11px] font-medium border transition-colors ${
                              numFee === preset
                                ? 'bg-cyan-500/20 border-cyan-400/50 text-cyan-300'
                                : 'bg-slate-800 border-slate-700 text-slate-400 hover:text-slate-200'
                            }`}
                          >
                            {preset === 0 ? 'Gratis' : formatRupiah(preset, settings.numberFormat)}
                          </button>
                        ))}
                      </div>
                    </div>
                    <CurrencyInput
                      value={adminFee}
                      onChange={setAdminFee}
                      numberFormat={settings.numberFormat}
                      placeholder="0"
                    />
                  </div>

                  {numAmount > 0 && (
                    <div className="p-3.5 rounded-xl bg-cyan-950/30 border border-cyan-500/25 text-xs space-y-1.5">
                      <div className="flex justify-between text-slate-300">
                        <span>Total Dipotong dari Rekening Asal:</span>
                        <span className="font-bold text-rose-300 tabular-nums">
                          -{formatRupiah(totalDeducted, settings.numberFormat)}

                      </div>
                      <div className="flex justify-between text-slate-300">
                        <span>Diterima Rekening Tujuan (Transfer Internal):</span>
                        <span className="font-bold text-emerald-300 tabular-nums">
                          +{formatRupiah(numAmount, settings.numberFormat)}
                        </span>

                      <div className="flex justify-between text-slate-400 pt-1 border-t border-cyan-500/15">
                        <span>Biaya Admin (Masuk Laporan Pengeluaran):</span>
                        <span className="font-semibold text-amber-300 tabular-nums">
                          {formatRupiah(numFee, settings.numberFormat)}

              ) : (

                    <select
                      value={type === 'INCOME' ? toAccountId : fromAccountId}

                      className="w-full px-3.5 py-2.5 bg-slate-950/80 border border-slate-700/80 rounded-xl text-sm text-slate-100 focus:outline-none focus:border-cyan-400"
                    >
                      <option value="">-- Pilih Rekening --</option>
                      {activeAccounts.map((acc) => (
                        <option key={acc.id} value={acc.id}>
                          {acc.bankName} - {acc.name} ({formatRupiah(accountBalances[acc.id] || 0, settings.numberFormat)})
                        </option>

                    </select>
                  </div>

                    <select

                      onChange={(e) => setCategoryId(e.target.value)}
                      className="w-full px-3.5 py-2.5 bg-slate-950/80 border border-slate-700/80 rounded-xl text-sm text-slate-100 focus:outline-none focus:border-cyan-400"
                    >
                      <option value="">-- Pilih Kategori --</option>

                        <option key={cat.id} value={cat.id}>
                          {cat.name}

                    </select>

                </label>
                <input
                  type="text"
                  value={description}
                  onChange={(e) => setDescription(e.target.value)}
                  placeholder={
                    type === 'INCOME'

    function DashboardPage({ onOpenTxModal, onSelectAccountDetail }) {
      const { accounts, transactions, categories, accountBalances, settings, deleteTransaction, showToast } = useFinance();

      const [periodType, setPeriodType] = useState('MONTH');
      const [customStart, setCustomStart] = useState(getTodayWIB());
      const [customEnd, setCustomEnd] = useState(getTodayWIB());
      const [selectedTx, setSelectedTx] = useState(null);
      const [editingTx, setEditingTx] = useState(null);
      const [deletingTx, setDeletingTx] = useState(null);

      const periodRange = useMemo(
        () => getPeriodRange(periodType, getTodayWIB(), customStart, customEnd),
        [periodType, customStart, customEnd]
      );

      const metrics = useMemo(
        () => calculatePeriodMetrics(transactions, periodRange.startDate, periodRange.endDate),
        [transactions, periodRange]
      );

      const totalAllBalance = useMemo(() => {
        return accounts
          .filter((a) => a.isActive)
          .reduce((sum, acc) => sum + (accountBalances[acc.id] || 0), 0);
      }, [accounts, accountBalances]);

      const incomeExpenseChartData = useMemo(() => {
        const map = new Map();
        const isYearly = periodType === 'YEAR';

        metrics.transactions.forEach((tx) => {
          const key = isYearly ? tx.date.slice(0, 7) : tx.date;
          if (!map.has(key)) {
            map.set(key, {
              key,
              label: isYearly ? tx.date.slice(0, 7) : formatTanggal(tx.date, 'DD MMM YYYY').slice(0, 6),
              Pemasukan: 0,
              Pengeluaran: 0
            });
          }
          const entry = map.get(key);
          if (tx.type === 'INCOME') entry.Pemasukan += tx.amount;
          if (tx.type === 'EXPENSE') entry.Pengeluaran += tx.amount;
          if (tx.type === 'TRANSFER' && tx.adminFee > 0) entry.Pengeluaran += tx.adminFee;
        });

        return Array.from(map.values()).sort((a, b) => a.key.localeCompare(b.key));
      }, [metrics.transactions, periodType]);

      const balanceProgressionData = useMemo(() => {
        const initialTotal = accounts.reduce((s, a) => s + (Number(a.initialBalance) || 0), 0);
        const sortedTxs = [...transactions].sort((a, b) => a.date.localeCompare(b.date));

        let runningTotal = initialTotal;
        const dailyBalanceMap = new Map();

        sortedTxs.forEach((tx) => {
          if (tx.type === 'INCOME') runningTotal += tx.amount;
          if (tx.type === 'EXPENSE') runningTotal -= tx.amount;
          if (tx.type === 'TRANSFER') runningTotal -= (tx.adminFee || 0);
          dailyBalanceMap.set(tx.date, runningTotal);
        });

        const entries = Array.from(dailyBalanceMap.entries())
          .filter(([d]) => d >= periodRange.startDate && d <= periodRange.endDate)
          .map(([d, saldo]) => ({
            date: d,
            label: formatTanggal(d, 'DD MMM YYYY'),
            Saldo: saldo
          }));

        if (entries.length === 0) {
          return [{ date: periodRange.endDate, label: 'Saldo Saat Ini', Saldo: totalAllBalance }];
        }
        return entries;
      }, [accounts, transactions, periodRange, totalAllBalance]);

      const expenseCategoryDistribution = useMemo(() => {
        const catMap = new Map(categories.map((c) => [c.id, c]));
        const totals = new Map();

        metrics.transactions.forEach((tx) => {
          if (tx.type === 'EXPENSE') {
            const cat = catMap.get(tx.categoryId);
            const name = cat?.name || 'Lainnya';
            const color = cat?.color || '#64748B';
            const curr = totals.get(name) || { name, value: 0, color };
            curr.value += tx.amount;
            totals.set(name, curr);
          } else if (tx.type === 'TRANSFER' && tx.adminFee > 0) {
            const name = 'Biaya Admin Transfer';
            const curr = totals.get(name) || { name, value: 0, color: '#F59E0B' };
            curr.value += tx.adminFee;
            totals.set(name, curr);
          }
        });

        return Array.from(totals.values()).sort((a, b) => b.value - a.value);
      }, [metrics.transactions, categories]);

      const monthlyComparisonData = useMemo(() => {
        const today = getTodayWIB();
        const [cy, cm] = today.split('-').map(Number);
        const namaBulan = ['Jan', 'Feb', 'Mar', 'Apr', 'Mei', 'Jun', 'Jul', 'Agu', 'Sep', 'Okt', 'Nov', 'Des'];
        const months = [];

        for (let i = 5; i >= 0; i--) {
          const dt = new Date(Date.UTC(cy, cm - 1 - i, 1));
          const ym = dt.toISOString().slice(0, 7);
          const label = `${namaBulan[dt.getUTCMonth()]} ${String(dt.getUTCFullYear()).slice(2)}`;
          months.push({ ym, label, Pengeluaran: 0, Pemasukan: 0 });
        }

        const monthMap = new Map(months.map((m) => [m.ym, m]));
        transactions.forEach((tx) => {
          const ym = tx.date.slice(0, 7);
          if (monthMap.has(ym)) {
            const item = monthMap.get(ym);
            if (tx.type === 'INCOME') item.Pemasukan += tx.amount;
            if (tx.type === 'EXPENSE') item.Pengeluaran += tx.amount;
            if (tx.type === 'TRANSFER' && tx.adminFee > 0) item.Pengeluaran += tx.adminFee;
          }
        });

        return months;
      }, [transactions]);

      const recentTransactions = useMemo(() => {
        return [...metrics.transactions]
          .sort((a, b) => b.date.localeCompare(a.date) || (b.createdAt || '').localeCompare(a.createdAt || ''))
          .slice(0, 8);

      const categoryMap = useMemo(() => new Map(categories.map((c) => [c.id, c])), [categories]);
      const accountMap = useMemo(() => new Map(accounts.map((a) => [a.id, a])), [accounts]);

      const handleConfirmDelete = async () => {

      return (
        <div className="space-y-6 animate-fadeIn">
          {/* Header & Filter Periode Dashboard */}

            <div>
              <div className="flex items-center gap-2 text-xs font-semibold text-cyan-400 uppercase tracking-wider">

          </div>

          {periodType === 'CUSTOM' && (

          {/* A. RINGKASAN KEUANGAN */}
          <div className="grid grid-cols-1 sm:grid-cols-2 xl:grid-cols-5 gap-4">
            <div className="sm:col-span-2 xl:col-span-1 p-5 rounded-2xl bg-gradient-to-br from-cyan-500/20 via-blue-600/15 to-slate-900 border border-cyan-400/30 shadow-lg">
