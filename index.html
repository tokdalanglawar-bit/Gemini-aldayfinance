              <div className="mb-3">
                <h3 className="text-base font-bold text-white">Perkembangan Total Saldo</h3>
                <p className="text-xs text-slate-400">Tren akumulasi kekayaan bersih seluruh rekening</p>
              </div>
              <InteractiveAreaChart
                data={balanceProgressionData}
                numberFormat={settings.numberFormat}
              />
            </div>

            <div className="p-5 rounded-2xl bg-slate-900/90 border border-slate-800">
              <div className="mb-4">
                <h3 className="text-base font-bold text-white">Distribusi Pengeluaran per Kategori</h3>
                <p className="text-xs text-slate-400">Proporsi belanja & biaya administrasi periode ini</p>
              </div>
              <InteractiveDonutChart
                data={expenseCategoryDistribution}
                numberFormat={settings.numberFormat}
              />
            </div>

            <div className="p-5 rounded-2xl bg-slate-900/90 border border-slate-800">
              <div className="mb-3">
                <h3 className="text-base font-bold text-white">Perbandingan Antarbulan (6 Bulan Terakhir)</h3>
                <p className="text-xs text-slate-400">Evaluasi tren pemasukan & pengeluaran bulanan</p>
              </div>
              <InteractiveBarChart
                data={monthlyComparisonData}
                keys={['Pemasukan', 'Pengeluaran']}
                colors={['#06B6D4', '#F43F5E']}
                numberFormat={settings.numberFormat}
              />
            </div>
          </div>

          {/* D. TRANSAKSI TERBARU */}
          <div className="bg-slate-900/90 border border-slate-800 rounded-2xl overflow-hidden">
            <div className="p-5 border-b border-slate-800 flex flex-wrap items-center justify-between gap-3">
              <div>
                <h3 className="text-base font-bold text-white">Transaksi Terbaru</h3>
                <p className="text-xs text-slate-400">Aktivitas keuangan terkini pada periode {periodRange.label}</p>
              </div>
              <div className="flex items-center gap-2">
                <button
                  onClick={() => onOpenTxModal('EXPENSE')}
                  className="px-3 py-1.5 rounded-xl text-xs font-semibold bg-rose-500/15 text-rose-300 border border-rose-500/30 hover:bg-rose-500/25 transition-colors flex items-center gap-1"
                >
                  <Icon name="Plus" className="w-3.5 h-3.5" /> Pengeluaran
                </button>
                <button
                  onClick={() => onOpenTxModal('INCOME')}
                  className="px-3 py-1.5 rounded-xl text-xs font-semibold bg-emerald-500/15 text-emerald-300 border border-emerald-500/30 hover:bg-emerald-500/25 transition-colors flex items-center gap-1"
                >
                  <Icon name="Plus" className="w-3.5 h-3.5" /> Pemasukan
                </button>
              </div>
            </div>

            {recentTransactions.length === 0 ? (
              <div className="p-10 text-center">
                <Icon name="Receipt" className="w-10 h-10 text-slate-600 mx-auto mb-3" />
                <p className="text-sm font-semibold text-slate-300">Belum ada transaksi tercatat</p>
                <p className="text-xs text-slate-500 mt-1 max-w-md mx-auto">
                  Mulai catat pemasukan, pengeluaran, atau transfer antarrekening Anda menggunakan tombol di atas.
                </p>
              </div>
            ) : (
              <div className="divide-y divide-slate-800/80">
                {recentTransactions.map((tx) => {
                  const cat = tx.categoryId ? categoryMap.get(tx.categoryId) : null;
                  const fromAcc = tx.fromAccountId ? accountMap.get(tx.fromAccountId) : null;
                  const toAcc = tx.toAccountId ? accountMap.get(tx.toAccountId) : null;

                  return (
                    <div
                      key={tx.id}
                      onClick={() => setSelectedTx(tx)}
                      className="p-4 sm:px-6 hover:bg-slate-800/40 transition-colors cursor-pointer flex items-center justify-between gap-4"
                    >
                      <div className="flex items-center gap-3.5 min-w-0">
                        <div
                          className="w-10 h-10 rounded-xl flex items-center justify-center shrink-0 border"
                          style={{
                            backgroundColor: tx.type === 'TRANSFER' ? 'rgba(6,182,212,0.12)' : `${cat?.color || '#64748B'}20`,
                            borderColor: tx.type === 'TRANSFER' ? 'rgba(6,182,212,0.35)' : `${cat?.color || '#64748B'}40`,
                            color: tx.type === 'TRANSFER' ? '#22D3EE' : cat?.color || '#94A3B8'
                          }}
                        >
                          <Icon name={tx.type === 'TRANSFER' ? 'Send' : (cat?.icon || 'Wallet')} className="w-4 h-4" />
                        </div>

                        <div className="min-w-0">
                          <p className="text-sm font-semibold text-slate-100 truncate">{tx.description}</p>
                          <div className="flex flex-wrap items-center gap-x-2 gap-y-1 text-xs text-slate-400 mt-0.5">
                            <span>{formatTanggal(tx.date, settings.dateFormat)}</span>
                            <span>•</span>
                            <span>
                              {tx.type === 'TRANSFER'
                                ? `${fromAcc?.bankName || '?'} → ${toAcc?.bankName || '?'}`
                                : cat?.name || 'Kategori'}
                            </span>
                            {tx.type !== 'TRANSFER' && (
                              <>
                                <span>•</span>
                                <span className="text-slate-300 font-medium">
                                  {tx.type === 'INCOME' ? toAcc?.bankName : fromAcc?.bankName}
                                </span>
                              </>
                            )}
                          </div>
                        </div>
                      </div>

                      <div className="text-right shrink-0">
                        <p
                          className={`text-sm sm:text-base font-bold tabular-nums ${
                            tx.type === 'INCOME'
                              ? 'text-emerald-400'
                              : tx.type === 'EXPENSE'
                              ? 'text-rose-400'
                              : 'text-cyan-400'
                          }`}
                        >
                          {tx.type === 'INCOME' ? '+' : tx.type === 'EXPENSE' ? '-' : ''}
                          {formatRupiah(tx.amount, settings.numberFormat)}
                        </p>
                        <span className="inline-block text-[10px] font-semibold uppercase tracking-wider text-slate-500">
                          {tx.type === 'INCOME' ? 'Pemasukan' : tx.type === 'EXPENSE' ? 'Pengeluaran' : `Transfer${tx.adminFee > 0 ? ` (+Admin ${formatRupiah(tx.adminFee, settings.numberFormat, false)})` : ''}`}
                        </span>
                      </div>
                    </div>
                  );
                })}
              </div>
            )}
          </div>

          <TransactionDetailModal
            tx={selectedTx}
            onClose={() => setSelectedTx(null)}
            onEdit={(t) => setEditingTx(t)}
            onDelete={(t) => setDeletingTx(t)}
          />
          <TransactionModal open={Boolean(editingTx)} editingTx={editingTx} onClose={() => setEditingTx(null)} />
          <ConfirmDialog
            open={Boolean(deletingTx)}
            title="Hapus Transaksi?"
            message={`Transaksi "${deletingTx?.description}" sebesar ${formatRupiah(deletingTx?.amount || 0, settings.numberFormat)} akan dihapus permanen dan saldo rekening terkait akan otomatis dikembalikan.`}
            confirmLabel="Ya, Hapus Transaksi"
            onConfirm={handleConfirmDelete}
            onCancel={() => setDeletingTx(null)}
          />
        </div>
      );
    }

    // ============================================================================
    // 10. HALAMAN 2: MANAJEMEN TRANSAKSI
    // ============================================================================
    function TransactionsPage({ onOpenTxModal }) {
      const { transactions, accounts, categories, settings, deleteTransaction, showToast } = useFinance();

      const [search, setSearch] = useState('');
      const [filterType, setFilterType] = useState('ALL');
      const [filterCategory, setFilterCategory] = useState('ALL');
      const [filterAccount, setFilterAccount] = useState('ALL');
      const [dateFrom, setDateFrom] = useState('');
      const [dateTo, setDateTo] = useState('');
      const [sortBy, setSortBy] = useState('DATE_DESC');

      const [selectedTx, setSelectedTx] = useState(null);
      const [editingTx, setEditingTx] = useState(null);
      const [deletingTx, setDeletingTx] = useState(null);

      const accountMap = useMemo(() => new Map(accounts.map((a) => [a.id, a])), [accounts]);
      const categoryMap = useMemo(() => new Map(categories.map((c) => [c.id, c])), [categories]);

      const filteredAndSorted = useMemo(() => {
        const q = search.trim().toLowerCase();

        return transactions
          .filter((tx) => {
            if (filterType !== 'ALL' && tx.type !== filterType) return false;
            if (filterCategory !== 'ALL' && tx.categoryId !== filterCategory) return false;
            if (filterAccount !== 'ALL') {
              if (tx.fromAccountId !== filterAccount && tx.toAccountId !== filterAccount) return false;
            }
            if (dateFrom && tx.date < dateFrom) return false;
            if (dateTo && tx.date > dateTo) return false;

            if (q) {
              const catName = tx.categoryId ? (categoryMap.get(tx.categoryId)?.name || '').toLowerCase() : 'transfer';
              const fromName = tx.fromAccountId ? (accountMap.get(tx.fromAccountId)?.bankName || '').toLowerCase() : '';
              const toName = tx.toAccountId ? (accountMap.get(tx.toAccountId)?.bankName || '').toLowerCase() : '';
              const matchDesc = (tx.description || '').toLowerCase().includes(q);
              const matchNotes = (tx.notes || '').toLowerCase().includes(q);
              if (!matchDesc && !matchNotes && !catName.includes(q) && !fromName.includes(q) && !toName.includes(q)) {
                return false;
              }
            }
            return true;
          })
          .sort((a, b) => {
            if (sortBy === 'DATE_ASC') return a.date.localeCompare(b.date);
            if (sortBy === 'AMOUNT_DESC') return b.amount - a.amount;
            if (sortBy === 'AMOUNT_ASC') return a.amount - b.amount;
            return b.date.localeCompare(a.date) || (b.createdAt || '').localeCompare(a.createdAt || '');
          });
      }, [transactions, search, filterType, filterCategory, filterAccount, dateFrom, dateTo, sortBy, categoryMap, accountMap]);

      const resetFilters = () => {
        setSearch('');
        setFilterType('ALL');
        setFilterCategory('ALL');
        setFilterAccount('ALL');
        setDateFrom('');
        setDateTo('');
        setSortBy('DATE_DESC');
      };

      const handleConfirmDelete = async () => {
        if (!deletingTx) return;
        await deleteTransaction(deletingTx.id);
        showToast('Transaksi dihapus dan saldo telah disesuaikan.', 'success');
        setDeletingTx(null);
      };

      return (
        <div className="space-y-6 animate-fadeIn">
          <div className="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4">
            <div>
              <h2 className="text-2xl font-bold text-white">Daftar Transaksi</h2>
              <p className="text-sm text-slate-400">Kelola seluruh catatan pemasukan, pengeluaran, dan transfer</p>
            </div>
            <div className="flex flex-wrap items-center gap-2">
              <button
                onClick={() => onOpenTxModal('INCOME')}
                className="px-3.5 py-2.5 rounded-xl text-xs font-bold bg-emerald-500/15 text-emerald-300 border border-emerald-500/30 hover:bg-emerald-500/25 flex items-center gap-1.5 transition-colors"
              >
                <Icon name="Plus" className="w-4 h-4" /> Pemasukan
              </button>
              <button
                onClick={() => onOpenTxModal('EXPENSE')}
                className="px-3.5 py-2.5 rounded-xl text-xs font-bold bg-rose-500/15 text-rose-300 border border-rose-500/30 hover:bg-rose-500/25 flex items-center gap-1.5 transition-colors"
              >
                <Icon name="Plus" className="w-4 h-4" /> Pengeluaran
              </button>
              <button
                onClick={() => onOpenTxModal('TRANSFER')}
                className="px-3.5 py-2.5 rounded-xl text-xs font-bold bg-cyan-500 text-slate-950 hover:bg-cyan-400 flex items-center gap-1.5 transition-colors shadow-lg shadow-cyan-500/20"
              >
                <Icon name="Send" className="w-3.5 h-3.5" /> Transfer
              </button>
            </div>
          </div>

          <div className="p-4 sm:p-5 rounded-2xl bg-slate-900/90 border border-slate-800 space-y-4">
            <div className="grid grid-cols-1 md:grid-cols-4 gap-3">
              <div className="md:col-span-2 relative">
                <Icon name="Search" className="w-4 h-4 text-slate-400 absolute left-3.5 top-1/2 -translate-y-1/2" />
                <input
                  type="text"
                  value={search}
                  onChange={(e) => setSearch(e.target.value)}
                  placeholder="Cari deskripsi, catatan, bank, atau kategori..."
                  className="w-full pl-10 pr-4 py-2.5 bg-slate-950/80 border border-slate-700/80 rounded-xl text-sm text-slate-100 placeholder-slate-500 focus:outline-none focus:border-cyan-400"
                />
              </div>

              <select
                value={filterType}
                onChange={(e) => setFilterType(e.target.value)}
                className="px-3.5 py-2.5 bg-slate-950/80 border border-slate-700/80 rounded-xl text-sm text-slate-200 focus:outline-none focus:border-cyan-400"
              >
                <option value="ALL">Semua Jenis Transaksi</option>
                <option value="INCOME">Pemasukan</option>
                <option value="EXPENSE">Pengeluaran</option>
                <option value="TRANSFER">Transfer Antarrekening</option>
              </select>

              <select
                value={sortBy}
                onChange={(e) => setSortBy(e.target.value)}
                className="px-3.5 py-2.5 bg-slate-950/80 border border-slate-700/80 rounded-xl text-sm text-slate-200 focus:outline-none focus:border-cyan-400"
              >
                <option value="DATE_DESC">Urutkan: Tanggal Terbaru</option>
                <option value="DATE_ASC">Urutkan: Tanggal Terlama</option>
                <option value="AMOUNT_DESC">Urutkan: Nominal Terbesar</option>
                <option value="AMOUNT_ASC">Urutkan: Nominal Terkecil</option>
              </select>
            </div>

            <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-3">
              <select
                value={filterAccount}
                onChange={(e) => setFilterAccount(e.target.value)}
                className="px-3.5 py-2 bg-slate-950/80 border border-slate-700/80 rounded-xl text-xs text-slate-200"
              >
                <option value="ALL">Semua Rekening</option>
                {accounts.map((a) => (
                  <option key={a.id} value={a.id}>
                    {a.bankName} - {a.name}
                  </option>
                ))}
              </select>

              <select
                value={filterCategory}
                onChange={(e) => setFilterCategory(e.target.value)}
                className="px-3.5 py-2 bg-slate-950/80 border border-slate-700/80 rounded-xl text-xs text-slate-200"
              >
                <option value="ALL">Semua Kategori</option>
                {categories.map((c) => (
                  <option key={c.id} value={c.id}>
                    {c.name} ({c.type === 'INCOME' ? 'Masuk' : 'Keluar'})
                  </option>
                ))}
              </select>

              <div className="flex items-center gap-2">
                <span className="text-xs text-slate-400 shrink-0">Dari:</span>
                <input
                  type="date"
                  value={dateFrom}
                  onChange={(e) => setDateFrom(e.target.value)}
                  className="w-full px-3 py-2 bg-slate-950/80 border border-slate-700/80 rounded-xl text-xs text-slate-200"
                />
              </div>

              <div className="flex items-center gap-2">
                <span className="text-xs text-slate-400 shrink-0">S/d:</span>
                <input
                  type="date"
                  value={dateTo}
                  onChange={(e) => setDateTo(e.target.value)}
                  className="w-full px-3 py-2 bg-slate-950/80 border border-slate-700/80 rounded-xl text-xs text-slate-200"
                />
              </div>
            </div>

            <div className="flex items-center justify-between text-xs text-slate-400 pt-1">
              <span>Menampilkan <strong className="text-white">{filteredAndSorted.length}</strong> transaksi</span>
              {(search || filterType !== 'ALL' || filterCategory !== 'ALL' || filterAccount !== 'ALL' || dateFrom || dateTo) && (
                <button onClick={resetFilters} className="text-cyan-400 hover:underline font-medium">
                  Reset Semua Filter
                </button>
              )}
            </div>
          </div>

          <div className="bg-slate-900/90 border border-slate-800 rounded-2xl overflow-hidden">
            {filteredAndSorted.length === 0 ? (
              <div className="p-12 text-center">
                <Icon name="Search" className="w-10 h-10 text-slate-600 mx-auto mb-3" />
                <p className="text-sm font-semibold text-slate-300">Tidak ada transaksi ditemukan</p>
                <p className="text-xs text-slate-500 mt-1">Coba ubah kata kunci pencarian atau filter tanggal Anda.</p>
              </div>
            ) : (
              <>
                <div className="hidden lg:block overflow-x-auto">
                  <table className="w-full text-left border-collapse">
                    <thead>
                      <tr className="border-b border-slate-800 bg-slate-950/60 text-[11px] font-bold uppercase tracking-wider text-slate-400">
                        <th className="py-3.5 px-5">Tanggal</th>
                        <th className="py-3.5 px-4">Deskripsi & Kategori</th>
                        <th className="py-3.5 px-4">Rekening</th>
                        <th className="py-3.5 px-4">Jenis</th>
                        <th className="py-3.5 px-4 text-right">Nominal</th>
                        <th className="py-3.5 px-5 text-right">Aksi</th>
                      </tr>
                    </thead>
                    <tbody className="divide-y divide-slate-800/70 text-sm">
                      {filteredAndSorted.map((tx) => {
                        const cat = tx.categoryId ? categoryMap.get(tx.categoryId) : null;
                        const fromAcc = tx.fromAccountId ? accountMap.get(tx.fromAccountId) : null;
                        const toAcc = tx.toAccountId ? accountMap.get(tx.toAccountId) : null;

                        return (
                          <tr key={tx.id} className="hover:bg-slate-800/35 transition-colors">
                            <td className="py-3.5 px-5 text-slate-300 whitespace-nowrap">
                              {formatTanggal(tx.date, settings.dateFormat)}
                            </td>
                            <td className="py-3.5 px-4">
                              <p className="font-semibold text-slate-100">{tx.description}</p>
                              <p className="text-xs text-slate-400">
                                {tx.type === 'TRANSFER' ? 'Transfer Internal Antarrekening' : cat?.name || '-'}
                              </p>
                            </td>
                            <td className="py-3.5 px-4 text-slate-300">
                              {tx.type === 'TRANSFER' ? (
                                <span className="text-xs font-medium text-cyan-300">
                                  {fromAcc?.bankName} → {toAcc?.bankName}
                                </span>
                              ) : tx.type === 'INCOME' ? (
                                <span className="text-xs font-medium">{toAcc?.bankName} - {toAcc?.name}</span>
                              ) : (
                                <span className="text-xs font-medium">{fromAcc?.bankName} - {fromAcc?.name}</span>
                              )}
                            </td>
                            <td className="py-3.5 px-4">
                              <span
                                className={`inline-flex px-2.5 py-0.5 rounded-full text-[11px] font-semibold ${
                                  tx.type === 'INCOME'
                                    ? 'bg-emerald-500/15 text-emerald-300'
                                    : tx.type === 'EXPENSE'
                                    ? 'bg-rose-500/15 text-rose-300'
                                    : 'bg-cyan-500/15 text-cyan-300'
                                }`}
                              >
                                {tx.type === 'INCOME' ? 'Pemasukan' : tx.type === 'EXPENSE' ? 'Pengeluaran' : 'Transfer'}
                              </span>
                            </td>
                            <td className="py-3.5 px-4 text-right whitespace-nowrap">
                              <p
                                className={`font-bold tabular-nums ${
                                  tx.type === 'INCOME'
                                    ? 'text-emerald-400'
                                    : tx.type === 'EXPENSE'
                                    ? 'text-rose-400'
                                    : 'text-cyan-400'
                                }`}
                              >
                                {tx.type === 'INCOME' ? '+' : tx.type === 'EXPENSE' ? '-' : ''}
                                {formatRupiah(tx.amount, settings.numberFormat)}
                              </p>
                              {tx.type === 'TRANSFER' && tx.adminFee > 0 && (
                                <p className="text-[11px] text-amber-400 tabular-nums">
                                  Admin: {formatRupiah(tx.adminFee, settings.numberFormat)}
                                </p>
                              )}
                            </td>
                            <td className="py-3.5 px-5 text-right whitespace-nowrap">
                              <div className="inline-flex items-center gap-1">
                                <button
                                  onClick={() => setSelectedTx(tx)}
                                  title="Lihat Detail"
                                  className="p-2 rounded-lg text-slate-400 hover:text-white hover:bg-slate-800 transition-colors"
                                >
                                  <Icon name="Eye" className="w-4 h-4" />
                                </button>
                                <button
                                  onClick={() => setEditingTx(tx)}
                                  title="Edit Transaksi"
                                  className="p-2 rounded-lg text-slate-400 hover:text-cyan-300 hover:bg-slate-800 transition-colors"
                                >
                                  <Icon name="Edit3" className="w-4 h-4" />
                                </button>
                                <button
                                  onClick={() => setDeletingTx(tx)}
                                  title="Hapus Transaksi"
                                  className="p-2 rounded-lg text-slate-400 hover:text-rose-400 hover:bg-slate-800 transition-colors"
                                >
                                  <Icon name="Trash2" className="w-4 h-4" />
                                </button>
                              </div>
                            </td>
                          </tr>
                        );
                      })}
                    </tbody>
                  </table>
                </div>

                <div className="lg:hidden divide-y divide-slate-800">
                  {filteredAndSorted.map((tx) => {
                    const cat = tx.categoryId ? categoryMap.get(tx.categoryId) : null;
                    const fromAcc = tx.fromAccountId ? accountMap.get(tx.fromAccountId) : null;
                    const toAcc = tx.toAccountId ? accountMap.get(tx.toAccountId) : null;

                    return (
                      <div key={tx.id} className="p-4 space-y-2.5">
                        <div className="flex items-start justify-between gap-3">
                          <div>
                            <p className="font-semibold text-slate-100 text-sm">{tx.description}</p>
                            <p className="text-xs text-slate-400 mt-0.5">
                              {formatTanggal(tx.date, settings.dateFormat)} •{' '}
                              {tx.type === 'TRANSFER'
                                ? `${fromAcc?.bankName} → ${toAcc?.bankName}`
                                : `${cat?.name || '-'} (${tx.type === 'INCOME' ? toAcc?.bankName : fromAcc?.bankName})`}
                            </p>
                          </div>
                          <div className="text-right">
                            <p
                              className={`font-bold text-sm tabular-nums ${
                                tx.type === 'INCOME'
                                  ? 'text-emerald-400'
                                  : tx.type === 'EXPENSE'
                                  ? 'text-rose-400'
                                  : 'text-cyan-400'
                              }`}
                            >
                              {tx.type === 'INCOME' ? '+' : tx.type === 'EXPENSE' ? '-' : ''}
                              {formatRupiah(tx.amount, settings.numberFormat)}
                            </p>
                            {tx.type === 'TRANSFER' && tx.adminFee > 0 && (
                              <p className="text-[11px] text-amber-400">Admin: {formatRupiah(tx.adminFee, settings.numberFormat)}</p>
                            )}
                          </div>
                        </div>

                        <div className="flex items-center justify-end gap-2 pt-1">
                          <button onClick={() => setSelectedTx(tx)} className="px-3 py-1.5 rounded-lg text-xs bg-slate-800 text-slate-300">
                            Detail
                          </button>
                          <button onClick={() => setEditingTx(tx)} className="px-3 py-1.5 rounded-lg text-xs bg-cyan-500/15 text-cyan-300">
                            Edit
                          </button>
                          <button onClick={() => setDeletingTx(tx)} className="px-3 py-1.5 rounded-lg text-xs bg-rose-500/15 text-rose-300">
                            Hapus
                          </button>
                        </div>
                      </div>
                    );
                  })}
                </div>
              </>
            )}
          </div>

          <TransactionDetailModal tx={selectedTx} onClose={() => setSelectedTx(null)} onEdit={(t) => setEditingTx(t)} onDelete={(t) => setDeletingTx(t)} />
          <TransactionModal open={Boolean(editingTx)} editingTx={editingTx} onClose={() => setEditingTx(null)} />
          <ConfirmDialog
            open={Boolean(deletingTx)}
            title="Hapus Transaksi?"
            message={`Transaksi "${deletingTx?.description}" sebesar ${formatRupiah(deletingTx?.amount || 0, settings.numberFormat)} akan dihapus secara permanen.`}
            confirmLabel="Hapus Permanen"
            onConfirm={handleConfirmDelete}
            onCancel={() => setDeletingTx(null)}
          />
        </div>
      );
    }

    // ============================================================================
    // 11. HALAMAN 3: MANAJEMEN REKENING
    // ============================================================================
    function AccountsPage({ preselectedAccountId, onClearPreselectedAccount }) {
      const { accounts, transactions, categories, accountBalances, saveAccount, settings, showToast } = useFinance();

      const [showModal, setShowModal] = useState(false);
      const [editingAcc, setEditingAcc] = useState(null);
      const [detailAccId, setDetailAccId] = useState(preselectedAccountId || null);

      const [name, setName] = useState('');
      const [bankName, setBankName] = useState('');
      const [initialBalance, setInitialBalance] = useState('');

      useEffect(() => {
        if (preselectedAccountId) {
          setDetailAccId(preselectedAccountId);
          if (onClearPreselectedAccount) onClearPreselectedAccount();
        }
      }, [preselectedAccountId, onClearPreselectedAccount]);

      const openAdd = () => {
        setEditingAcc(null);
        setName('');
        setBankName('');
        setInitialBalance('');
        setShowModal(true);
      };

      const openEdit = (acc) => {
        setEditingAcc(acc);
        setName(acc.name);
        setBankName(acc.bankName);
        setInitialBalance(acc.initialBalance);
        setShowModal(true);
      };

      const handleSaveAccount = async (e) => {
        e.preventDefault();
        if (!name.trim() || !bankName.trim()) {
          showToast('Nama rekening dan nama bank wajib diisi.', 'error');
          return;
        }

        const payload = {
          id: editingAcc?.id || generateId('acc'),
          name: name.trim(),
          bankName: bankName.trim(),
          initialBalance: Math.round(Number(initialBalance) || 0),
          isActive: editingAcc ? editingAcc.isActive : true,
          createdAt: editingAcc?.createdAt || getNowISO()
        };

        await saveAccount(payload);
        showToast(editingAcc ? 'Rekening berhasil diperbarui.' : 'Rekening baru berhasil ditambahkan.', 'success');
        setShowModal(false);
      };

      const handleToggleActive = async (acc) => {
        await saveAccount({ ...acc, isActive: !acc.isActive });
        showToast(
          !acc.isActive ? `Rekening ${acc.bankName} diaktifkan kembali.` : `Rekening ${acc.bankName} dinonaktifkan.`,
          'info'
        );
      };

      const selectedAccount = useMemo(
        () => accounts.find((a) => a.id === detailAccId) || null,
        [accounts, detailAccId]
      );

      const accountLedger = useMemo(() => {
        if (!selectedAccount) return [];
        const related = transactions
          .filter((tx) => tx.fromAccountId === selectedAccount.id || tx.toAccountId === selectedAccount.id)
          .sort((a, b) => a.date.localeCompare(b.date) || (a.createdAt || '').localeCompare(b.createdAt || ''));

        let running = Math.round(Number(selectedAccount.initialBalance) || 0);
        const rows = related.map((tx) => {
          let delta = 0;
          let roleLabel = '';
          if (tx.type === 'INCOME' && tx.toAccountId === selectedAccount.id) {
            delta = tx.amount;
            roleLabel = 'Pemasukan';
          } else if (tx.type === 'EXPENSE' && tx.fromAccountId === selectedAccount.id) {
            delta = -tx.amount;
            roleLabel = 'Pengeluaran';
          } else if (tx.type === 'TRANSFER') {
            if (tx.fromAccountId === selectedAccount.id) {
              delta = -(tx.amount + (tx.adminFee || 0));
              roleLabel = tx.adminFee > 0 ? `Transfer Keluar (+Admin ${formatRupiah(tx.adminFee, settings.numberFormat, false)})` : 'Transfer Keluar';
            } else if (tx.toAccountId === selectedAccount.id) {
              delta = tx.amount;
              roleLabel = 'Transfer Masuk';
            }
          }
          running += delta;
          return { ...tx, delta, roleLabel, runningBalance: running };
        });

        return rows.reverse();
      }, [selectedAccount, transactions, settings.numberFormat]);

      const categoryMap = useMemo(() => new Map(categories.map((c) => [c.id, c])), [categories]);

      return (
        <div className="space-y-6 animate-fadeIn">
          <div className="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4">
            <div>
              <h2 className="text-2xl font-bold text-white">Manajemen Rekening</h2>
              <p className="text-sm text-slate-400">Kelola saldo awal, status aktif, dan mutasi rekening bank Anda</p>
            </div>
            <button
              onClick={openAdd}
              className="px-4 py-2.5 rounded-xl text-sm font-bold text-slate-950 bg-cyan-500 hover:bg-cyan-400 shadow-lg shadow-cyan-500/20 flex items-center gap-2 transition-all self-start"
            >
              <Icon name="Plus" className="w-4 h-4" /> Tambah Rekening Baru
            </button>
          </div>

          <div className="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-5">
            {accounts.map((acc) => {
              const theme = BANK_THEMES[acc.bankName] || BANK_THEMES.DEFAULT;
              const currentBal = accountBalances[acc.id] || 0;
              const txCount = transactions.filter((t) => t.fromAccountId === acc.id || t.toAccountId === acc.id).length;

              return (
                <div
                  key={acc.id}
                  className={`rounded-2xl border p-5 transition-all flex flex-col justify-between ${
                    acc.isActive
                      ? `bg-gradient-to-br ${theme.gradient} border-slate-800`
                      : 'bg-slate-900/40 border-slate-800/60 opacity-65'
                  }`}
                >
                  <div>
                    <div className="flex items-center justify-between gap-2">
                      <span className={`px-2.5 py-1 rounded-lg text-xs font-bold border ${theme.badgeBg}`}>
                        {acc.bankName}
                      </span>
                      <span
                        className={`px-2 py-0.5 rounded-full text-[11px] font-semibold ${
                          acc.isActive ? 'bg-emerald-500/15 text-emerald-300' : 'bg-slate-700 text-slate-400'
                        }`}
                      >
                        {acc.isActive ? 'Aktif' : 'Nonaktif'}
                      </span>
                    </div>

                    <h3 className="mt-3 text-lg font-bold text-white">{acc.name}</h3>
                    <p className="text-xs text-slate-400 mt-0.5">
                      Dibuat: {formatTanggal(acc.createdAt?.slice(0, 10) || getTodayWIB(), settings.dateFormat)} • {txCount} transaksi
                    </p>

                    <div className="mt-4 p-3.5 rounded-xl bg-slate-950/60 border border-white/5 space-y-1.5">
                      <div className="flex justify-between text-xs">
                        <span className="text-slate-400">Saldo Awal</span>
                        <span className="text-slate-300 font-semibold tabular-nums">
                          {formatRupiah(acc.initialBalance, settings.numberFormat)}
                        </span>
                      </div>
                      <div className="flex justify-between items-baseline pt-1 border-t border-slate-800">
                        <span className="text-xs text-slate-400">Saldo Saat Ini</span>
                        <span className="text-lg font-extrabold text-white tabular-nums">
                          {formatRupiah(currentBal, settings.numberFormat)}
                        </span>
                      </div>
                    </div>
                  </div>

                  <div className="mt-4 pt-3 border-t border-white/10 flex items-center justify-between gap-2">
                    <button
                      onClick={() => setDetailAccId(acc.id)}
                      className="px-3 py-2 rounded-xl text-xs font-semibold bg-cyan-500/15 text-cyan-300 hover:bg-cyan-500/25 border border-cyan-500/30 flex items-center gap-1.5 transition-colors"
                    >
                      <Icon name="Eye" className="w-3.5 h-3.5" /> Detail & Mutasi
                    </button>
                    <div className="flex items-center gap-1.5">
                      <button
                        onClick={() => openEdit(acc)}
                        title="Edit Rekening"
                        className="p-2 rounded-xl bg-slate-800/80 text-slate-300 hover:text-white hover:bg-slate-700 transition-colors"
                      >
                        <Icon name="Edit3" className="w-4 h-4" />
                      </button>
                      <button
                        onClick={() => handleToggleActive(acc)}
                        title={acc.isActive ? 'Nonaktifkan Rekening' : 'Aktifkan Rekening'}
                        className={`p-2 rounded-xl transition-colors ${
                          acc.isActive
                            ? 'bg-slate-800/80 text-amber-300 hover:bg-amber-500/20'
                            : 'bg-emerald-500/20 text-emerald-300 hover:bg-emerald-500/30'
                        }`}
                      >
                        <Icon name={acc.isActive ? 'PowerOff' : 'Power'} className="w-4 h-4" />
                      </button>
                    </div>
                  </div>
                </div>
              );
            })}
          </div>

          {selectedAccount && (
            <div className="bg-slate-900 border border-cyan-500/30 rounded-2xl overflow-hidden shadow-xl">
              <div className="p-5 bg-slate-950/70 border-b border-slate-800 flex flex-wrap items-center justify-between gap-4">
                <div>
                  <div className="flex items-center gap-2">
                    <span className="px-2.5 py-0.5 rounded-md text-xs font-bold bg-cyan-500/20 text-cyan-300">
                      {selectedAccount.bankName}
                    </span>
                    <h3 className="text-lg font-bold text-white">Histori Mutasi: {selectedAccount.name}</h3>
                  </div>
                  <p className="text-xs text-slate-400 mt-1">
                    Saldo Awal: {formatRupiah(selectedAccount.initialBalance, settings.numberFormat)} • Saldo Akhir:{' '}
                    <strong className="text-cyan-300">
                      {formatRupiah(accountBalances[selectedAccount.id] || 0, settings.numberFormat)}
                    </strong>
                  </p>
                </div>
                <button
                  onClick={() => setDetailAccId(null)}
                  className="px-3 py-1.5 rounded-xl text-xs font-semibold bg-slate-800 text-slate-300 hover:text-white flex items-center gap-1"
                >
                  <Icon name="X" className="w-4 h-4" /> Tutup Mutasi
                </button>
              </div>

              {accountLedger.length === 0 ? (
                <div className="p-8 text-center text-xs text-slate-400">
                  Belum ada histori transaksi pada rekening {selectedAccount.bankName}.
                </div>
              ) : (
                <div className="overflow-x-auto">
                  <table className="w-full text-left border-collapse text-sm">
                    <thead>
                      <tr className="border-b border-slate-800 bg-slate-950/40 text-[11px] uppercase tracking-wider text-slate-400">
                        <th className="py-3 px-5">Tanggal</th>
                        <th className="py-3 px-4">Keterangan</th>
                        <th className="py-3 px-4">Jenis Mutasi</th>
                        <th className="py-3 px-4 text-right">Mutasi</th>
                        <th className="py-3 px-5 text-right">Saldo Berjalan</th>
                      </tr>
                    </thead>
                    <tbody className="divide-y divide-slate-800/70">
                      {accountLedger.map((row) => (
                        <tr key={row.id} className="hover:bg-slate-800/30">
                          <td className="py-3 px-5 text-slate-300 whitespace-nowrap">
                            {formatTanggal(row.date, settings.dateFormat)}
                          </td>
                          <td className="py-3 px-4">
                            <p className="font-medium text-slate-100">{row.description}</p>
                            {row.categoryId && (
                              <p className="text-xs text-slate-500">{categoryMap.get(row.categoryId)?.name}</p>
                            )}
                          </td>
                          <td className="py-3 px-4 text-xs text-slate-300">{row.roleLabel}</td>
                          <td
                            className={`py-3 px-4 text-right font-bold tabular-nums whitespace-nowrap ${
                              row.delta >= 0 ? 'text-emerald-400' : 'text-rose-400'
                            }`}
                          >
                            {row.delta >= 0 ? '+' : ''}
                            {formatRupiah(row.delta, settings.numberFormat)}
                          </td>
                          <td className="py-3 px-5 text-right font-semibold text-slate-200 tabular-nums whitespace-nowrap">
                            {formatRupiah(row.runningBalance, settings.numberFormat)}
                          </td>
                        </tr>
                      ))}
                    </tbody>
                  </table>
                </div>
              )}
            </div>
          )}

          {showModal && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-950/85 backdrop-blur-sm">
              <div className="w-full max-w-md bg-slate-900 border border-slate-700 rounded-3xl shadow-2xl overflow-hidden">
                <div className="px-6 py-4 bg-slate-950/70 border-b border-slate-800 flex items-center justify-between">
                  <h3 className="text-lg font-bold text-white">
                    {editingAcc ? 'Edit Rekening' : 'Tambah Rekening Baru'}
                  </h3>
                  <button onClick={() => setShowModal(false)} className="text-slate-400 hover:text-white">
                    <Icon name="X" className="w-5 h-5" />
                  </button>
                </div>
                <form onSubmit={handleSaveAccount} className="p-6 space-y-4">
                  <div>
                    <label className="block text-xs font-semibold text-slate-400 mb-1.5">
                      Nama Bank / Institusi <span className="text-rose-400">*</span>
                    </label>
                    <input
                      type="text"
                      value={bankName}
                      onChange={(e) => setBankName(e.target.value)}
                      placeholder="Contoh: BRI, BNI, Permata, BCA, Mandiri"
                      required
                      className="w-full px-3.5 py-2.5 bg-slate-950 border border-slate-700 rounded-xl text-sm text-white focus:outline-none focus:border-cyan-400"
                    />
                  </div>

                  <div>
                    <label className="block text-xs font-semibold text-slate-400 mb-1.5">
                      Nama Rekening <span className="text-rose-400">*</span>
                    </label>
                    <input
                      type="text"
                      value={name}
                      onChange={(e) => setName(e.target.value)}
                      placeholder="Contoh: Tabungan Utama, Rekening Operasional"
                      required
                      className="w-full px-3.5 py-2.5 bg-slate-950 border border-slate-700 rounded-xl text-sm text-white focus:outline-none focus:border-cyan-400"
                    />
                  </div>

                  <div>
                    <label className="block text-xs font-semibold text-slate-400 mb-1.5">
                      Saldo Awal (Rupiah)
                    </label>
                    <CurrencyInput
                      value={initialBalance}
                      onChange={setInitialBalance}
                      numberFormat={settings.numberFormat}
                      placeholder="0"
                    />
                  </div>

                  <div className="pt-3 flex justify-end gap-3 border-t border-slate-800">
                    <button
                      type="button"
                      onClick={() => setShowModal(false)}
                      className="px-4 py-2.5 rounded-xl text-sm font-medium bg-slate-800 text-slate-300"
                    >
                      Batal
                    </button>
                    <button
                      type="submit"
                      className="px-5 py-2.5 rounded-xl text-sm font-bold text-slate-950 bg-cyan-500 hover:bg-cyan-400"
                    >
                      Simpan Rekening
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}
        </div>
      );
    }

    // ============================================================================
    // 12. HALAMAN 4: SISTEM TRANSFER ANTARREKENING
    // ============================================================================
    function TransferPage() {
      const { accounts, transactions, accountBalances, saveTransaction, deleteTransaction, settings, showToast } = useFinance();

      const activeAccounts = useMemo(() => accounts.filter((a) => a.isActive), [accounts]);
      const accountMap = useMemo(() => new Map(accounts.map((a) => [a.id, a])), [accounts]);

      const [date, setDate] = useState(getTodayWIB());
      const [fromAccountId, setFromAccountId] = useState('');
      const [toAccountId, setToAccountId] = useState('');
      const [amount, setAmount] = useState('');
      const [adminFee, setAdminFee] = useState('');
      const [description, setDescription] = useState('');
      const [editingTx, setEditingTx] = useState(null);
      const [deletingTx, setDeletingTx] = useState(null);

      useEffect(() => {
        if (activeAccounts.length >= 2 && !fromAccountId && !toAccountId) {
          setFromAccountId(activeAccounts[0].id);
          setToAccountId(activeAccounts[1].id);
        }
      }, [activeAccounts, fromAccountId, toAccountId]);

      const transferHistory = useMemo(() => {
        return transactions
          .filter((tx) => tx.type === 'TRANSFER')
          .sort((a, b) => b.date.localeCompare(a.date) || (b.createdAt || '').localeCompare(a.createdAt || ''));
      }, [transactions]);

      const numAmount = Math.round(Number(amount) || 0);
      const numFee = Math.round(Number(adminFee) || 0);
      const totalOut = numAmount + numFee;

      const srcAcc = accountMap.get(fromAccountId);
      const dstAcc = accountMap.get(toAccountId);
      const srcCurrentBal = fromAccountId ? accountBalances[fromAccountId] || 0 : 0;
      const dstCurrentBal = toAccountId ? accountBalances[toAccountId] || 0 : 0;

      const handleSubmitTransfer = async (e) => {
        e.preventDefault();
        const payload = {
          id: generateId('tx'),
          type: 'TRANSFER',
          date,
          amount: numAmount,
          adminFee: numFee,
          categoryId: null,
          fromAccountId,
          toAccountId,
          description: description.trim() || `Transfer ${srcAcc?.bankName || ''} ke ${dstAcc?.bankName || ''}`,
          notes: '',
          createdAt: getNowISO(),
          updatedAt: getNowISO()
        };

        const validation = validateTransactionInput(payload, accounts);
        if (!validation.isValid) {
          showToast(validation.errors[0], 'error');
          return;
        }

        await saveTransaction(payload, false);
        showToast(
          `Transfer ${formatRupiah(numAmount, settings.numberFormat)} berhasil dicatat${numFee > 0 ? ` (Biaya admin ${formatRupiah(numFee, settings.numberFormat)} masuk pengeluaran)` : ''}.`,
          'success'
        );
        setAmount('');
        setAdminFee('');
        setDescription('');
      };

      return (
        <div className="space-y-6 animate-fadeIn">
          <div>
            <h2 className="text-2xl font-bold text-white">Transfer Antarrekening</h2>
            <p className="text-sm text-slate-400">
              Pemindahan dana internal antarbank dengan pemisahan otomatis antara nominal transfer dan biaya administrasi
            </p>
          </div>

          <div className="grid grid-cols-1 lg:grid-cols-12 gap-6">
            <form
              onSubmit={handleSubmitTransfer}
              className="lg:col-span-7 p-5 sm:p-6 rounded-2xl bg-slate-900/90 border border-slate-800 space-y-4"
            >
              <div className="flex items-center gap-2 text-sm font-bold text-cyan-300 pb-2 border-b border-slate-800">
                <Icon name="Send" className="w-4 h-4" /> Formulir Transfer Antarbank
              </div>

              <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <div>
                  <label className="block text-xs font-semibold text-slate-400 mb-1.5">Rekening Asal</label>
                  <select
                    value={fromAccountId}
                    onChange={(e) => setFromAccountId(e.target.value)}
                    className="w-full px-3.5 py-2.5 bg-slate-950 border border-slate-700 rounded-xl text-sm text-white focus:outline-none focus:border-cyan-400"
                  >
                    <option value="">-- Pilih Rekening Asal --</option>
                    {activeAccounts.map((a) => (
                      <option key={a.id} value={a.id}>
                        {a.bankName} - {a.name} ({formatRupiah(accountBalances[a.id] || 0, settings.numberFormat)})
                      </option>
                    ))}
                  </select>
                </div>

                <div>
                  <label className="block text-xs font-semibold text-slate-400 mb-1.5">Rekening Tujuan</label>
                  <select
                    value={toAccountId}
                    onChange={(e) => setToAccountId(e.target.value)}
                    className="w-full px-3.5 py-2.5 bg-slate-950 border border-slate-700 rounded-xl text-sm text-white focus:outline-none focus:border-cyan-400"
                  >
                    <option value="">-- Pilih Rekening Tujuan --</option>
                    {activeAccounts.map((a) => (
                      <option key={a.id} value={a.id}>
                        {a.bankName} - {a.name} ({formatRupiah(accountBalances[a.id] || 0, settings.numberFormat)})
                      </option>
                    ))}
                  </select>
                </div>
              </div>

              <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <div>
                  <label className="block text-xs font-semibold text-slate-400 mb-1.5">Nominal Transfer</label>
                  <CurrencyInput
                    value={amount}
                    onChange={setAmount}
                    numberFormat={settings.numberFormat}
                    placeholder="500.000"
                  />
                </div>

                <div>
                  <div className="flex items-center justify-between mb-1.5">
                    <label className="text-xs font-semibold text-slate-400">Biaya Administrasi</label>
                    <div className="flex gap-1">
                      {[0, 2500, 6500].map((fee) => (
                        <button
                          key={fee}
                          type="button"
                          onClick={() => setAdminFee(fee === 0 ? '' : fee)}
                          className={`px-2 py-0.5 rounded text-[10px] font-semibold border ${
                            numFee === fee
                              ? 'bg-cyan-500/20 border-cyan-400 text-cyan-300'
                              : 'bg-slate-800 border-slate-700 text-slate-400'
                          }`}
                        >
                          {fee === 0 ? 'Rp 0' : formatRupiah(fee, settings.numberFormat)}
                        </button>
                      ))}
                    </div>
                  </div>
                  <CurrencyInput
                    value={adminFee}
                    onChange={setAdminFee}
                    numberFormat={settings.numberFormat}
                    placeholder="2.500"
                  />
                </div>
              </div>

              <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <div>
                  <label className="block text-xs font-semibold text-slate-400 mb-1.5">Tanggal Transfer</label>
                  <input
                    type="date"
                    value={date}
                    onChange={(e) => setDate(e.target.value)}
                    className="w-full px-3.5 py-2.5 bg-slate-950 border border-slate-700 rounded-xl text-sm text-white"
                  />
                </div>
                <div>
                  <label className="block text-xs font-semibold text-slate-400 mb-1.5">Deskripsi</label>
                  <input
                    type="text"
                    value={description}
                    onChange={(e) => setDescription(e.target.value)}
                    placeholder="Contoh: Transfer BI-FAST BRI ke BNI"
                    className="w-full px-3.5 py-2.5 bg-slate-950 border border-slate-700 rounded-xl text-sm text-white"
                  />
                </div>
              </div>

              <button
                type="submit"
                className="w-full py-3 rounded-xl font-bold text-sm text-slate-950 bg-gradient-to-r from-cyan-400 to-blue-500 hover:from-cyan-300 hover:to-blue-400 shadow-lg shadow-cyan-500/20 flex items-center justify-center gap-2 transition-all"
              >
                <Icon name="Send" className="w-4 h-4" /> Eksekusi Pencatatan Transfer
              </button>
            </form>

            <div className="lg:col-span-5 p-5 sm:p-6 rounded-2xl bg-gradient-to-br from-slate-900 via-slate-900 to-cyan-950/30 border border-cyan-500/25 flex flex-col justify-between space-y-4">
              <div>
                <h3 className="text-sm font-bold uppercase tracking-wider text-cyan-300 flex items-center gap-2">
                  <Icon name="ShieldCheck" className="w-4 h-4" /> Simulasi Akuntansi Transfer
                </h3>
                <p className="text-xs text-slate-400 mt-1">
                  Pratinjau perubahan saldo sebelum transaksi disimpan:
                </p>

                <div className="mt-4 space-y-3">
                  <div className="p-3.5 rounded-xl bg-slate-950/80 border border-slate-800">
                    <div className="flex justify-between text-xs text-slate-400">
                      <span>Rekening Asal ({srcAcc?.bankName || 'Belum dipilih'})</span>
                      <span>Saat ini: {formatRupiah(srcCurrentBal, settings.numberFormat)}</span>
                    </div>
                    <div className="mt-1.5 flex justify-between items-baseline">
                      <span className="text-xs text-rose-400">
                        Potongan: -{formatRupiah(totalOut, settings.numberFormat)}
                      </span>
                      <span className="text-sm font-bold text-white tabular-nums">
                        Akhir: {formatRupiah(srcCurrentBal - totalOut, settings.numberFormat)}
                      </span>
                    </div>

    // ============================================================================
    // 13. HALAMAN 5: KATEGORI TRANSAKSI
    // ============================================================================
    function CategoriesPage() {
      const { categories, transactions, saveCategory, deleteCategoryWithReassign, showToast } = useFinance();

      const [activeTab, setActiveTab] = useState('EXPENSE');
      const [showModal, setShowModal] = useState(false);
      const [editingCat, setEditingCat] = useState(null);

      const [catName, setCatName] = useState('');
      const [catType, setCatType] = useState('EXPENSE');
      const [catIcon, setCatIcon] = useState('Utensils');
      const [catColor, setCatColor] = useState('#06B6D4');

      const [deletingCat, setDeletingCat] = useState(null);
      const [fallbackCatId, setFallbackCatId] = useState('');

      const txCountByCategory = useMemo(() => {
        const counts = {};
        transactions.forEach((tx) => {
          if (tx.categoryId) counts[tx.categoryId] = (counts[tx.categoryId] || 0) + 1;
        });
        return counts;
      }, [transactions]);

      const displayedCategories = useMemo(
        () => categories.filter((c) => c.type === activeTab),
        [categories, activeTab]
      );

      const openAdd = () => {
        setEditingCat(null);
        setCatName('');
        setCatType(activeTab);
        setCatIcon(activeTab === 'INCOME' ? 'Briefcase' : 'Utensils');
        setCatColor(activeTab === 'INCOME' ? '#10B981' : '#06B6D4');
        setShowModal(true);
      };

      const openEdit = (cat) => {
        setEditingCat(cat);
        setCatName(cat.name);
        setCatType(cat.type);
        setCatIcon(cat.icon);
        setCatColor(cat.color);
        setShowModal(true);
      };

      const handleSaveCategory = async (e) => {
        e.preventDefault();
        if (!catName.trim()) {
          showToast('Nama kategori tidak boleh kosong.', 'error');
          return;
        }

        const payload = {
          id: editingCat?.id || generateId('cat'),
          name: catName.trim(),
          type: editingCat ? editingCat.type : catType,
          icon: catIcon,
          color: catColor,
          isDefault: editingCat?.isDefault || false
        };

        await saveCategory(payload);
        showToast(editingCat ? 'Kategori diperbarui.' : 'Kategori baru ditambahkan.', 'success');
        setShowModal(false);
      };

      const initiateDelete = (cat) => {
        const sameTypeOthers = categories.filter((c) => c.type === cat.type && c.id !== cat.id);
        if (sameTypeOthers.length === 0) {
          showToast('Minimal harus tersisa satu kategori pada jenis transaksi ini.', 'error');
          return;
        }
        setDeletingCat(cat);
        setFallbackCatId(sameTypeOthers[0].id);
      };

      const confirmDeleteCategory = async () => {
        if (!deletingCat) return;
        const usedCount = txCountByCategory[deletingCat.id] || 0;
        await deleteCategoryWithReassign(deletingCat.id, usedCount > 0 ? fallbackCatId : null);
        showToast(
          usedCount > 0
            ? `Kategori dihapus dan ${usedCount} transaksi dipindahkan dengan aman.`
            : 'Kategori berhasil dihapus.',
          'success'
        );
        setDeletingCat(null);
      };

      const deletingUsedCount = deletingCat ? txCountByCategory[deletingCat.id] || 0 : 0;

      return (
        <div className="space-y-6 animate-fadeIn">
          <div className="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4">
            <div>
              <h2 className="text-2xl font-bold text-white">Kategori Transaksi</h2>
              <p className="text-sm text-slate-400">Atur kategori pemasukan dan pengeluaran beserta ikon & warnanya</p>
            </div>
            <button
              onClick={openAdd}
              className="px-4 py-2.5 rounded-xl text-sm font-bold text-slate-950 bg-cyan-500 hover:bg-cyan-400 shadow-lg shadow-cyan-500/20 flex items-center gap-2 self-start"
            >
              <Icon name="Plus" className="w-4 h-4" /> Tambah Kategori
            </button>
          </div>

          <div className="inline-flex p-1.5 rounded-2xl bg-slate-900 border border-slate-800">
            <button
              onClick={() => setActiveTab('EXPENSE')}
              className={`px-4 py-2 rounded-xl text-xs sm:text-sm font-semibold transition-all ${
                activeTab === 'EXPENSE'
                  ? 'bg-rose-500/20 text-rose-300 border border-rose-500/40'
                  : 'text-slate-400 hover:text-white'
              }`}
            >
              Kategori Pengeluaran ({categories.filter((c) => c.type === 'EXPENSE').length})
            </button>
            <button
              onClick={() => setActiveTab('INCOME')}
              className={`px-4 py-2 rounded-xl text-xs sm:text-sm font-semibold transition-all ${
                activeTab === 'INCOME'
                  ? 'bg-emerald-500/20 text-emerald-300 border border-emerald-500/40'
                  : 'text-slate-400 hover:text-white'
              }`}
            >
              Kategori Pemasukan ({categories.filter((c) => c.type === 'INCOME').length})
            </button>
          </div>

          <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-4">
            {displayedCategories.map((cat) => {
              const count = txCountByCategory[cat.id] || 0;
              return (
                <div
                  key={cat.id}
                  className="p-4 rounded-2xl bg-slate-900/90 border border-slate-800 hover:border-slate-700 transition-all flex items-center justify-between gap-3"
                >
                  <div className="flex items-center gap-3 min-w-0">
                    <div
                      className="w-11 h-11 rounded-xl flex items-center justify-center shrink-0 border"
                      style={{
                        backgroundColor: `${cat.color}20`,
                        borderColor: `${cat.color}45`,
                        color: cat.color
                      }}
                    >
                      <Icon name={cat.icon} className="w-5 h-5" />
                    </div>
                    <div className="min-w-0">
                      <p className="font-bold text-slate-100 text-sm truncate">{cat.name}</p>
                      <p className="text-xs text-slate-400 mt-0.5">{count} transaksi</p>
                    </div>
                  </div>

                  <div className="flex items-center gap-1 shrink-0">
                    <button onClick={() => openEdit(cat)} title="Edit Kategori" className="p-2 rounded-lg text-slate-400 hover:text-cyan-300 hover:bg-slate-800">
                      <Icon name="Edit3" className="w-4 h-4" />
                    </button>
                    <button onClick={() => initiateDelete(cat)} title="Hapus Kategori" className="p-2 rounded-lg text-slate-400 hover:text-rose-400 hover:bg-slate-800">
                      <Icon name="Trash2" className="w-4 h-4" />
                    </button>
                  </div>
                </div>
              );
            })}
          </div>

          {showModal && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-950/85 backdrop-blur-sm">
              <div className="w-full max-w-md bg-slate-900 border border-slate-700 rounded-3xl shadow-2xl overflow-hidden">
                <div className="px-6 py-4 bg-slate-950/70 border-b border-slate-800 flex items-center justify-between">
                  <h3 className="text-lg font-bold text-white">
                    {editingCat ? 'Edit Kategori' : 'Tambah Kategori Baru'}
                  </h3>
                  <button onClick={() => setShowModal(false)} className="text-slate-400 hover:text-white">
                    <Icon name="X" className="w-5 h-5" />
                  </button>
                </div>

                <form onSubmit={handleSaveCategory} className="p-6 space-y-4">
                  <div>
                    <label className="block text-xs font-semibold text-slate-400 mb-1.5">Nama Kategori</label>
                    <input
                      type="text"
                      value={catName}
                      onChange={(e) => setCatName(e.target.value)}
                      placeholder="Contoh: Investasi, Olahraga, Listrik..."
                      required
                      className="w-full px-3.5 py-2.5 bg-slate-950 border border-slate-700 rounded-xl text-sm text-white focus:outline-none focus:border-cyan-400"
                    />
                  </div>

                  {!editingCat && (
                    <div>
                      <label className="block text-xs font-semibold text-slate-400 mb-1.5">Jenis Kategori</label>
                      <select
                        value={catType}
                        onChange={(e) => setCatType(e.target.value)}
                        className="w-full px-3.5 py-2.5 bg-slate-950 border border-slate-700 rounded-xl text-sm text-white"
                      >
                        <option value="EXPENSE">Pengeluaran</option>
                        <option value="INCOME">Pemasukan</option>
                      </select>
                    </div>
                  )}

                  <div>
                    <label className="block text-xs font-semibold text-slate-400 mb-2">Pilih Warna</label>
                    <div className="flex flex-wrap gap-2">
                      {COLOR_PALETTE.map((c) => (
                        <button
                          key={c}
                          type="button"
                          onClick={() => setCatColor(c)}
                          className={`w-7 h-7 rounded-full transition-transform ${
                            catColor === c ? 'scale-125 ring-2 ring-white' : 'opacity-80 hover:opacity-100'
                          }`}
                          style={{ backgroundColor: c }}
                        />
                      ))}
                    </div>
                  </div>

                  <div>
                    <label className="block text-xs font-semibold text-slate-400 mb-2">Pilih Ikon</label>
                    <div className="grid grid-cols-6 gap-2 max-h-36 overflow-y-auto p-2 bg-slate-950 rounded-xl border border-slate-800">
                      {AVAILABLE_ICONS.map((iconKey) => (
                        <button
                          key={iconKey}
                          type="button"
                          onClick={() => setCatIcon(iconKey)}
                          className={`p-2.5 rounded-lg flex items-center justify-center transition-colors ${
                            catIcon === iconKey
                              ? 'bg-cyan-500/25 text-cyan-300 border border-cyan-400'
                              : 'text-slate-400 hover:bg-slate-800 hover:text-white'
                          }`}
                        >
                          <Icon name={iconKey} className="w-4 h-4" />
                        </button>
                      ))}
                    </div>
                  </div>

                  <div className="pt-3 flex justify-end gap-3 border-t border-slate-800">
                    <button type="button" onClick={() => setShowModal(false)} className="px-4 py-2.5 rounded-xl text-sm font-medium bg-slate-800 text-slate-300">
                      Batal
                    </button>
                    <button type="submit" className="px-5 py-2.5 rounded-xl text-sm font-bold text-slate-950 bg-cyan-500 hover:bg-cyan-400">
                      Simpan Kategori
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {deletingCat && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-950/85 backdrop-blur-sm">
              <div className="w-full max-w-md bg-slate-900 border border-slate-700 rounded-2xl shadow-2xl overflow-hidden">
                <div className="p-6 space-y-4">
                  <div className="flex items-start gap-3">
                    <div className="p-2.5 rounded-xl bg-rose-500/15 text-rose-400 border border-rose-500/30">
                      <Icon name="AlertTriangle" className="w-5 h-5" />
                    </div>
                    <div>
                      <h3 className="text-lg font-bold text-white">Hapus Kategori "{deletingCat.name}"?</h3>
                      {deletingUsedCount > 0 ? (
                        <p className="text-xs text-slate-300 mt-1 leading-relaxed">
                          Kategori ini masih digunakan oleh <strong className="text-amber-300">{deletingUsedCount} transaksi</strong>. Pilih kategori pengganti agar seluruh riwayat transaksi tetap akurat:
                        </p>
                      ) : (
                        <p className="text-xs text-slate-300 mt-1">
                          Kategori ini belum memiliki transaksi dan aman untuk dihapus.
                        </p>
                      )}
                    </div>
                  </div>

                  {deletingUsedCount > 0 && (
                    <div>
                      <label className="block text-xs font-semibold text-slate-400 mb-1.5">
                        Pindahkan {deletingUsedCount} transaksi ke kategori:
                      </label>
                      <select
                        value={fallbackCatId}
                        onChange={(e) => setFallbackCatId(e.target.value)}
                        className="w-full px-3.5 py-2.5 bg-slate-950 border border-slate-700 rounded-xl text-sm text-white"
                      >
                        {categories
                          .filter((c) => c.type === deletingCat.type && c.id !== deletingCat.id)

                            <option key={c.id} value={c.id}>{c.name}</option>

                <div className="px-6 py-4 bg-slate-950/70 border-t border-slate-800 flex justify-end gap-3">

    // ============================================================================
    // 14. HALAMAN 6: LAPORAN KEUANGAN LENGKAP
    // ============================================================================
    function ReportsPage() {
      const { accounts, transactions, categories, settings } = useFinance();

      const [reportMode, setReportMode] = useState('MONTH');
      const [anchorDate, setAnchorDate] = useState(getTodayWIB());
      const [customStart, setCustomStart] = useState(getTodayWIB());
      const [customEnd, setCustomEnd] = useState(getTodayWIB());

      const range = useMemo(
        () => getPeriodRange(reportMode, anchorDate, customStart, customEnd),
        [reportMode, anchorDate, customStart, customEnd]
      );

      const prevRange = useMemo(() => {
        const [y, m, d] = anchorDate.split('-').map(Number);
        let prevAnchor = anchorDate;
        if (reportMode === 'TODAY') prevAnchor = new Date(Date.UTC(y, m - 1, d - 1)).toISOString().slice(0, 10);
        else if (reportMode === 'WEEK') prevAnchor = new Date(Date.UTC(y, m - 1, d - 7)).toISOString().slice(0, 10);
        else if (reportMode === 'MONTH') prevAnchor = new Date(Date.UTC(y, m - 2, 1)).toISOString().slice(0, 10);
        else if (reportMode === 'YEAR') prevAnchor = new Date(Date.UTC(y - 1, 0, 1)).toISOString().slice(0, 10);
        return getPeriodRange(reportMode, prevAnchor, customStart, customEnd);
      }, [reportMode, anchorDate, customStart, customEnd]);

      const currentMetrics = useMemo(
        () => calculatePeriodMetrics(transactions, range.startDate, range.endDate),
        [transactions, range]
      );

      const prevMetrics = useMemo(
        () => calculatePeriodMetrics(transactions, prevRange.startDate, prevRange.endDate),
        [transactions, prevRange]
      );

      const shiftAnchor = (direction) => {
        const [y, m, d] = anchorDate.split('-').map(Number);
        let nextDt;
        if (reportMode === 'TODAY') nextDt = new Date(Date.UTC(y, m - 1, d + direction));
        else if (reportMode === 'WEEK') nextDt = new Date(Date.UTC(y, m - 1, d + direction * 7));
        else if (reportMode === 'MONTH') nextDt = new Date(Date.UTC(y, m - 1 + direction, 1));
        else nextDt = new Date(Date.UTC(y + direction, 0, 1));
        setAnchorDate(nextDt.toISOString().slice(0, 10));
      };

      const expenseByCategory = useMemo(() => {
        const catMap = new Map(categories.map((c) => [c.id, c]));
        const map = new Map();

        currentMetrics.transactions.forEach((tx) => {
          if (tx.type === 'EXPENSE') {
            const cat = catMap.get(tx.categoryId);
            const key = tx.categoryId || 'uncategorized';
            const prev = map.get(key) || {
              id: key,
              name: cat?.name || 'Pengeluaran lainnya',
              color: cat?.color || '#64748B',
              amount: 0,
              count: 0
            };
            prev.amount += tx.amount;
            prev.count += 1;
            map.set(key, prev);
          } else if (tx.type === 'TRANSFER' && tx.adminFee > 0) {
            const key = 'admin-fee-transfer';
            const prev = map.get(key) || {
              id: key,
              name: 'Biaya Administrasi Transfer',
              color: '#F59E0B',
              amount: 0,
              count: 0
            };
            prev.amount += tx.adminFee;
            prev.count += 1;
            map.set(key, prev);
          }
        });

        return Array.from(map.values()).sort((a, b) => b.amount - a.amount);
      }, [currentMetrics.transactions, categories]);

      const incomeByCategory = useMemo(() => {
        const catMap = new Map(categories.map((c) => [c.id, c]));
        const map = new Map();

        currentMetrics.transactions.forEach((tx) => {
          if (tx.type === 'INCOME') {
            const cat = catMap.get(tx.categoryId);
            const key = tx.categoryId || 'uncategorized';
            const prev = map.get(key) || {
              id: key,
              name: cat?.name || 'Pendapatan lainnya',
              color: cat?.color || '#10B981',
              amount: 0,
              count: 0
            };
            prev.amount += tx.amount;
            prev.count += 1;
            map.set(key, prev);
          }
        });

        return Array.from(map.values()).sort((a, b) => b.amount - a.amount);
      }, [currentMetrics.transactions, categories]);

      const accountActivityReport = useMemo(() => {
        return accounts.map((acc) => {
          let income = 0;
          let expense = 0;
          let transferIn = 0;
          let transferOut = 0;
          let adminFee = 0;

          currentMetrics.transactions.forEach((tx) => {
            if (tx.type === 'INCOME' && tx.toAccountId === acc.id) income += tx.amount;
            if (tx.type === 'EXPENSE' && tx.fromAccountId === acc.id) expense += tx.amount;
            if (tx.type === 'TRANSFER') {
              if (tx.toAccountId === acc.id) transferIn += tx.amount;
              if (tx.fromAccountId === acc.id) {
                transferOut += tx.amount;
                adminFee += tx.adminFee || 0;
              }
            }
          });

          const netPeriodDelta = income + transferIn - expense - transferOut - adminFee;
          return { ...acc, income, expense, transferIn, transferOut, adminFee, netPeriodDelta };
        });
      }, [accounts, currentMetrics.transactions]);

      const comparisonChartData = [
        {
          label: 'Periode Lalu',
          Pemasukan: prevMetrics.totalIncome,
          Pengeluaran: prevMetrics.totalExpense,
          Transfer: prevMetrics.totalInternalTransfer
        },
        {
          label: 'Periode Ini',
          Pemasukan: currentMetrics.totalIncome,
          Pengeluaran: currentMetrics.totalExpense,
          Transfer: currentMetrics.totalInternalTransfer
        }
      ];

      return (
        <div className="space-y-6 animate-fadeIn">
          <div className="p-5 rounded-2xl bg-slate-900/90 border border-slate-800 space-y-4">
            <div className="flex flex-col lg:flex-row lg:items-center lg:justify-between gap-4">
              <div>
                <h2 className="text-2xl font-bold text-white">Laporan Keuangan Terpadu</h2>
                <p className="text-sm text-slate-400">Analisis arus kas, kategori, dan aktivitas setiap rekening bank</p>
              </div>

              <div className="flex flex-wrap gap-2">
                {[
                  { id: 'TODAY', label: 'Harian' },
                  { id: 'WEEK', label: 'Mingguan' },
                  { id: 'MONTH', label: 'Bulanan' },
                  { id: 'YEAR', label: 'Tahunan' },
                  { id: 'CUSTOM', label: 'Rentang Tanggal' }
                ].map((item) => (
                  <button
                    key={item.id}
                    onClick={() => setReportMode(item.id)}
                    className={`px-3.5 py-2 rounded-xl text-xs font-semibold transition-all ${
                      reportMode === item.id
